<!doctype html><html><head><style>html,body{margin:0}button{position:absolute;top:290px;left:10px}</style></head><body><svg id="scene" width="300" height="280"><rect id="xml" x="10" y="10" width="40" height="30" fill="red" style="fill:green"><set attributeName="fill" attributeType="XML" to="blue"/></rect><rect id="css" x="10" y="55" width="40" height="30" fill="red" style="fill:green"><set attributeName="fill" attributeType="CSS" to="blue"/></rect><rect id="important" x="10" y="100" width="40" height="30" fill="red" style="fill:green!important"><set attributeName="fill" attributeType="CSS" to="blue"/></rect><rect id="both" x="10" y="145" width="40" height="30" fill="red" style="fill:green"><set attributeName="fill" attributeType="CSS" to="blue"/><set attributeName="fill" attributeType="XML" to="yellow"/></rect><rect id="width_css" x="10" y="190" width="40" height="30" fill="red" style="width:60px!important"><animate attributeName="width" attributeType="CSS" from="20" to="180" dur="2s"/></rect><rect id="width_xml" x="10" y="235" width="40" height="30" fill="red" style="width:60px"><animate attributeName="width" attributeType="XML" from="20" to="180" dur="2s"/></rect></svg><button id="sample">Sample</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}document.getElementById("sample").onclick=function(){if(typeof scene.setCurrentTime==="function")scene.setCurrentTime(1);scene.setAttribute("data-widths",Math.round(document.getElementById("width_css").getBBox().width)+","+Math.round(document.getElementById("width_xml").getBBox().width));};</script></body></html>
