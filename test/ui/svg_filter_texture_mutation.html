<!doctype html><html><head><style>html,body{margin:0;background:white}svg{display:block}#advance{position:absolute;left:0;top:160px;width:100px;height:30px}</style></head><body><svg width="540" height="140"><defs>
<g id="piece"><rect id="paint" width="40" height="40" fill="red"/><rect x="40" width="40" height="40" fill="blue"/></g>
<g id="alternate"><rect width="40" height="40" fill="blue"/><rect x="40" width="40" height="40" fill="red"/></g>
<filter id="local" filterUnits="userSpaceOnUse" x="10" y="20" width="100" height="80"><feImage href="#piece" x="20" y="30" width="80" height="40"/></filter>
<filter id="raster" filterUnits="userSpaceOnUse" x="140" y="20" width="100" height="80"><feImage id="bitmap" href="svg_image_assets/split.png" x="150" y="30" width="80" height="40"/></filter>
<filter id="tile" filterUnits="userSpaceOnUse" x="280" y="20" width="160" height="80"><feImage id="tile-image" href="svg_image_assets/split.png" x="280" y="20" width="40" height="20" preserveAspectRatio="none"/><feTile/></filter>
<filter id="morph" filterUnits="userSpaceOnUse" x="440" y="20" width="100" height="80"><feMorphology id="radius" radius="0" operator="erode"/></filter>
</defs><rect x="10" y="20" width="100" height="80" filter="url(#local)"/><rect x="140" y="20" width="100" height="80" filter="url(#raster)"/><rect x="280" y="20" width="160" height="80" filter="url(#tile)"/><rect x="460" y="30" width="40" height="40" fill="red" filter="url(#morph)"/></svg><button id="advance" data-step="0">advance</button>
<script>var step=0;document.getElementById('advance').addEventListener('click',function(){step++;if(step===1){document.getElementById('paint').setAttribute('fill','#00ff00');document.getElementById('bitmap').setAttribute('href','#alternate');document.getElementById('tile-image').setAttribute('width','80');document.getElementById('radius').setAttribute('radius','6');}if(step===2){document.getElementById('paint').setAttribute('fill','red');document.getElementById('bitmap').setAttribute('href','svg_image_assets/split.png');document.getElementById('tile-image').setAttribute('width','40');document.getElementById('radius').setAttribute('operator','dilate');}this.setAttribute('data-step',String(step));});</script></body></html>
