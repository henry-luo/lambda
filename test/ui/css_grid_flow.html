<!doctype html><meta charset="utf-8"><style>html,body{margin:0}button{height:24px}</style>
<button id="check">Check</button><button id="density">Density</button><button id="changed">Changed</button><button id="axes">Axes</button><button id="axisrecord">Axis record</button><button id="restore">Restore</button><button id="restored">Restored</button><output id="report"></output><script>
(function(){
 var cases=[{"flow": "row", "name": "locked_gap", "items": [{"p": "2", "s": "1"}, {"p": "span 2", "s": "1"}, {"s": "1"}]}, {"flow": "row", "name": "locked_rows", "items": [{"p": "2", "s": "1"}, {"p": "span 2", "s": "1"}, {"s": "2"}, {"s": "1"}]}, {"flow": "row", "name": "cursor_gap", "items": [{"p": "2", "s": "1"}, {"p": "span 2"}, {"p": "3"}, {}]}, {"flow": "row", "name": "negative_only", "primary": "none", "items": [{"p": "-2"}, {}]}, {"flow": "row", "name": "span_extent", "items": [{"p": "span 4"}, {"p": "6"}, {}]}, {"flow": "row", "name": "locked_negative", "secondary": "none", "items": [{"s": "-2"}, {"s": "-2"}, {}]}, {"flow": "row", "name": "order", "items": [{"p": "span 2", "order": 2}, {"p": "2", "s": "1", "order": 0}, {"p": "3", "order": 1}, {}]}, {"flow": "row dense", "name": "locked_gap", "items": [{"p": "2", "s": "1"}, {"p": "span 2", "s": "1"}, {"s": "1"}]}, {"flow": "row dense", "name": "locked_rows", "items": [{"p": "2", "s": "1"}, {"p": "span 2", "s": "1"}, {"s": "2"}, {"s": "1"}]}, {"flow": "row dense", "name": "cursor_gap", "items": [{"p": "2", "s": "1"}, {"p": "span 2"}, {"p": "3"}, {}]}, {"flow": "row dense", "name": "negative_only", "primary": "none", "items": [{"p": "-2"}, {}]}, {"flow": "row dense", "name": "span_extent", "items": [{"p": "span 4"}, {"p": "6"}, {}]}, {"flow": "row dense", "name": "locked_negative", "secondary": "none", "items": [{"s": "-2"}, {"s": "-2"}, {}]}, {"flow": "row dense", "name": "order", "items": [{"p": "span 2", "order": 2}, {"p": "2", "s": "1", "order": 0}, {"p": "3", "order": 1}, {}]}, {"flow": "column", "name": "locked_gap", "items": [{"p": "2", "s": "1"}, {"p": "span 2", "s": "1"}, {"s": "1"}]}, {"flow": "column", "name": "locked_rows", "items": [{"p": "2", "s": "1"}, {"p": "span 2", "s": "1"}, {"s": "2"}, {"s": "1"}]}, {"flow": "column", "name": "cursor_gap", "items": [{"p": "2", "s": "1"}, {"p": "span 2"}, {"p": "3"}, {}]}, {"flow": "column", "name": "negative_only", "primary": "none", "items": [{"p": "-2"}, {}]}, {"flow": "column", "name": "span_extent", "items": [{"p": "span 4"}, {"p": "6"}, {}]}, {"flow": "column", "name": "locked_negative", "secondary": "none", "items": [{"s": "-2"}, {"s": "-2"}, {}]}, {"flow": "column", "name": "order", "items": [{"p": "span 2", "order": 2}, {"p": "2", "s": "1", "order": 0}, {"p": "3", "order": 1}, {}]}, {"flow": "column dense", "name": "locked_gap", "items": [{"p": "2", "s": "1"}, {"p": "span 2", "s": "1"}, {"s": "1"}]}, {"flow": "column dense", "name": "locked_rows", "items": [{"p": "2", "s": "1"}, {"p": "span 2", "s": "1"}, {"s": "2"}, {"s": "1"}]}, {"flow": "column dense", "name": "cursor_gap", "items": [{"p": "2", "s": "1"}, {"p": "span 2"}, {"p": "3"}, {}]}, {"flow": "column dense", "name": "negative_only", "primary": "none", "items": [{"p": "-2"}, {}]}, {"flow": "column dense", "name": "span_extent", "items": [{"p": "span 4"}, {"p": "6"}, {}]}, {"flow": "column dense", "name": "locked_negative", "secondary": "none", "items": [{"s": "-2"}, {"s": "-2"}, {}]}, {"flow": "column dense", "name": "order", "items": [{"p": "span 2", "order": 2}, {"p": "2", "s": "1", "order": 0}, {"p": "3", "order": 1}, {}]}];
 cases.forEach(function(fixture,index){
  var column=fixture.flow.indexOf('column')===0,primary=column?'Rows':'Columns',secondary=column?'Columns':'Rows';
  var grid=document.createElement('div');grid.id='grid-'+index;grid.style.cssText='display:grid;width:120px;height:120px;gap:2px;grid-auto-columns:10px;grid-auto-rows:10px;justify-content:start;align-content:start';
  grid.style.gridAutoFlow=fixture.flow;grid.style['gridTemplate'+primary]=fixture.primary||'repeat(3,10px)';grid.style['gridTemplate'+secondary]=fixture.secondary||'repeat(2,10px)';
  fixture.items.forEach(function(item){var child=document.createElement('div');child.style.cssText='min-width:0;min-height:0';if(item.p)child.style['grid'+primary.slice(0,-1)]=item.p;if(item.s)child.style['grid'+secondary.slice(0,-1)]=item.s;if(item.order!==undefined)child.style.order=item.order;grid.appendChild(child);});document.body.appendChild(grid);
 });
 function record(prefix){
  cases.forEach(function(fixture,index){var grid=document.getElementById('grid-'+index),g=grid.getBoundingClientRect(),style=getComputedStyle(grid),report=document.getElementById('report');
   report.setAttribute('data-'+prefix+index+'-columns',style.gridTemplateColumns);report.setAttribute('data-'+prefix+index+'-rows',style.gridTemplateRows);
   for(var i=0;i<grid.children.length;i++){var r=grid.children[i].getBoundingClientRect();report.setAttribute('data-'+prefix+index+'-rect-'+i,[r.x-g.x,r.y-g.y,r.width,r.height].join(','));}
  });
 }
 document.getElementById('check').onclick=function(){record('');};
 document.getElementById('density').onclick=function(){cases.forEach(function(fixture,index){document.getElementById('grid-'+index).style.gridAutoFlow=fixture.flow.indexOf('dense')<0?fixture.flow+' dense':fixture.flow.replace(' dense','');});};
 document.getElementById('changed').onclick=function(){record('changed-');};
 document.getElementById('axes').onclick=function(){cases.forEach(function(fixture,index){document.getElementById('grid-'+index).style.gridAutoFlow=(fixture.flow.indexOf('column')===0?'row':'column')+(fixture.flow.indexOf('dense')<0?'':' dense');});};
 document.getElementById('axisrecord').onclick=function(){record('axes-');};
 document.getElementById('restore').onclick=function(){cases.forEach(function(fixture,index){document.getElementById('grid-'+index).style.gridAutoFlow=fixture.flow;});};
 document.getElementById('restored').onclick=function(){record('restored-');};
})();</script>
