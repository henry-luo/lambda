<!doctype html><html><head><style>html,body{margin:0}button{position:absolute;left:10px;top:130px}</style></head><body><svg id="scene" width="300" height="120" font-size="20"><g><animate attributeName="font-size" from="100%" to="40" dur="2s" fill="freeze"/><rect x="10" y="10" width="2em" height="20" fill="red"/></g><g transform="translate(0 50)"><animate attributeName="font-size" from="1em" to="2em" dur="2s" fill="freeze"/><rect x="10" y="10" width="2em" height="20" fill="blue"/></g></svg><button id="sample">1s</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}document.getElementById("sample").onclick=function(){scene.setCurrentTime(1);};</script></body></html>
