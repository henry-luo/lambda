<!doctype html><html><head><style>html,body{margin:0}button{position:absolute;width:44px;height:30px;top:385px}</style></head><body><svg id="scene" width="650" height="320"><rect id="self" x="10" y="10" width="20" height="30" fill="red"><animate id="selfAnim" attributeName="x" from="10" to="110" begin="0;selfAnim.end+1s" dur="1s"/></rect><rect id="a" x="10" y="55" width="20" height="30" fill="red"><animate id="aAnim" attributeName="x" from="10" to="110" begin="0;bAnim.end+0.5s" dur="1s"/></rect><rect id="b" x="10" y="100" width="20" height="30" fill="red"><animate id="bAnim" attributeName="x" from="10" to="110" begin="aAnim.end+0.5s" dur="1s"/></rect><rect id="c" x="10" y="145" width="20" height="30" fill="red"><animate id="cAnim" attributeName="x" from="10" to="110" begin="dAnim.end" dur="1s"/></rect><rect id="d" x="10" y="190" width="20" height="30" fill="red"><animate id="dAnim" attributeName="x" from="10" to="110" begin="cAnim.end" dur="1s"/></rect><rect id="event" x="10" y="235" width="20" height="30" fill="red"><animate id="eventAnim" attributeName="x" from="10" to="110" begin="trigger.click;trigger.click+1.5s" dur="1s"/></rect></svg><button id="trigger" style="left:10px;top:335px;width:90px">Trigger</button><button id="sample0" style="left:5px">0s</button><button id="sample1" style="left:53px">0.5s</button><button id="sample2" style="left:101px">1s</button><button id="sample3" style="left:149px">1.5s</button><button id="sample4" style="left:197px">2s</button><button id="sample5" style="left:245px">2.5s</button><button id="sample6" style="left:293px">3s</button><button id="sample7" style="left:341px">3.5s</button><button id="sample8" style="left:389px">4.5s</button><button id="sample9" style="left:437px">5s</button><button id="sample10" style="left:485px">6s</button><button id="sample11" style="left:533px">6.5s</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-values","unsupported");return;}scene.setCurrentTime(t);var names=["self","a","b","c","d","event"],v=[];for(var i=0;i<names.length;i++){v.push(Math.round(document.getElementById(names[i]).getBBox().x));}scene.setAttribute("data-values",v.join(","));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(1.5);};document.getElementById("sample4").onclick=function(){sample(2);};document.getElementById("sample5").onclick=function(){sample(2.5);};document.getElementById("sample6").onclick=function(){sample(3);};document.getElementById("sample7").onclick=function(){sample(3.5);};document.getElementById("sample8").onclick=function(){sample(4.5);};document.getElementById("sample9").onclick=function(){sample(5);};document.getElementById("sample10").onclick=function(){sample(6);};document.getElementById("sample11").onclick=function(){sample(6.5);};</script></body></html>
