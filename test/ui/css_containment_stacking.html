<!doctype html><style>html,body{margin:0;background:white}.pair{position:absolute;top:10px;width:80px}.contained,.later{width:80px;height:40px}.contained{background:red}.later{margin-top:-40px;background:green}#controls{position:absolute;left:10px;top:100px}#paint-pair{left:10px}#paint{contain:paint}#layout-pair{left:100px}#layout{contain:layout}#style-pair{left:190px}#style{contain:style}#size-pair{left:280px}#size{contain:size}</style><div class="pair" id="paint-pair"><div class="contained" id="paint"></div><div class="later" id="paint-later"></div></div><div class="pair" id="layout-pair"><div class="contained" id="layout"></div><div class="later" id="layout-later"></div></div><div class="pair" id="style-pair"><div class="contained" id="style"></div><div class="later" id="style-later"></div></div><div class="pair" id="size-pair"><div class="contained" id="size"></div><div class="later" id="size-later"></div></div><div id="controls"><button id="remove">remove</button></div><script>document.getElementById('remove').addEventListener('click',function(){document.getElementById('paint').style.contain='none';document.getElementById('layout').style.contain='none';});</script>
