<!doctype html>
<meta charset="utf-8">
<title>Collapsed table borders in a scroll pane</title>
<style>
  body { margin: 0; background: #fff; }
  #pane { margin: 30px 0 0 100px; width: 120px; height: 80px; overflow: auto; background: #eee; }
  table { border-collapse: collapse; width: 280px; table-layout: fixed; }
  td { border: 4px solid #c00; height: 36px; padding: 0; }
</style>
<div id="pane">
  <table>
    <tr><td></td><td></td></tr>
    <tr><td></td><td></td></tr>
    <tr><td></td><td></td></tr>
  </table>
</div>
