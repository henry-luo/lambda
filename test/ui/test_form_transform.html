<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:white;font:14px Arial}
.panel{position:absolute;left:300px;top:60px;transform:translateX(-120px)}
.rotated{top:160px;transform:rotate(90deg);transform-origin:0 0}
select{width:140px;height:32px;font:14px Arial;color:black;background:white;padding:4px;border:1px solid #888}
input{width:20px;height:20px;accent-color:#11b35e}
</style></head><body>
<div class="panel"><select id="translated"><option>HHHH</option><option>MMMM</option></select></div>
<div class="panel rotated"><select id="rotated"><option>HHHH</option></select></div>
<div class="panel" style="top:320px"><input id="translated-check" type="checkbox" checked><input id="translated-radio" type="radio" checked></div>
</body></html>
