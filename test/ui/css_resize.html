<!doctype html><style>
html,body{margin:0}.box,textarea{position:absolute;top:40px;width:100px;height:60px;box-sizing:border-box;padding:6px;border:2px solid black;overflow:auto;background:#eee}
#h{left:20px;max-width:180px}.horizontal{resize:horizontal}#v{left:160px;resize:vertical;max-height:110px}
#both{left:300px;resize:both;box-sizing:content-box;min-width:90px;max-width:150px;min-height:40px;max-height:90px}
#none{left:500px;resize:none}.filler{width:200px;height:200px}
textarea{left:20px;top:160px;resize:both;width:120px;height:70px;min-width:100px;max-width:180px;min-height:50px;max-height:100px}
#flowwrap{position:absolute;left:240px;top:180px;width:200px}#flow{position:static;resize:both}#after{height:20px;background:green}
</style><button id="disable">Disable handle</button>
<div id="h" class="box horizontal"><div class="filler"></div></div><div id="v" class="box"><div class="filler"></div></div>
<div id="both" class="box"><div class="filler"></div></div><div id="none" class="box"><div class="filler"></div></div>
<textarea id="text">one
two
three</textarea><div id="flowwrap"><div id="flow" class="box"><div class="filler"></div></div><div id="after"></div></div>
<script>
document.getElementById('disable').onclick=function(){document.getElementById('h').classList.remove('horizontal');};
document.getElementById('v').addEventListener('pointermove',function(e){
 if(e.buttons && e.clientY>145)this.remove();
});
</script>
