<!doctype html><html><head><style>html,body{margin:0}button{position:absolute;top:100px;width:65px;height:30px}</style></head><body id="report"><div id="host"><svg id="scene" width="300" height="80"><defs><filter id="tone" filterUnits="userSpaceOnUse" x="180" y="10" width="30" height="20" color-interpolation-filters="sRGB"><feFlood flood-color="red"><animate attributeName="flood-color" from="red" to="blue" dur="2s" fill="freeze"/></feFlood></filter></defs><rect id="moving" x="10" y="10" width="20" height="20" fill="red"><animate attributeName="x" from="10" to="110" dur="2s" fill="freeze"/></rect><rect x="180" y="10" width="30" height="20" filter="url(#tone)"/></svg></div>
<button id="mid" style="left:10px">mid</button><button id="detach" style="left:80px">detach</button><button id="check" style="left:150px">check</button><button id="attach" style="left:220px">attach</button><button id="rewind" style="left:290px">rewind</button>
<script>var scene=document.getElementById("scene"),host=document.getElementById("host"),report=document.getElementById("report");scene.pauseAnimations();scene.setCurrentTime(0);document.getElementById("mid").onclick=function(){scene.setCurrentTime(1);};document.getElementById("detach").onclick=function(){scene.remove();scene.unpauseAnimations();};document.getElementById("check").onclick=function(){report.setAttribute("data-detached-time",String(Math.round(scene.getCurrentTime()*10)));report.setAttribute("data-connected",String(scene.isConnected));};document.getElementById("attach").onclick=function(){host.appendChild(scene);scene.pauseAnimations();scene.setCurrentTime(2);};document.getElementById("rewind").onclick=function(){scene.setCurrentTime(0);};</script></body></html>
