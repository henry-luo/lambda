<!doctype html>
<html><head><meta charset="utf-8"><title>Negative layers across paragraph anchors</title>
<style>
body { margin:0; }
#owner { position:relative; z-index:0; box-sizing:border-box; width:320px; height:300px; padding-top:50px; background:white; }
#anchor { position:relative; height:0; }
#low, #high { position:absolute; width:180px; height:60px; }
#low { left:20px; top:-30px; z-index:-2; background:red; }
#high { left:40px; top:-10px; z-index:-1; background:blue; }
#ink { margin-left:80px; width:80px; height:30px; background:lime; }
#clipper { position:absolute; left:240px; top:20px; width:40px; height:40px; overflow:hidden; }
#clipped { position:relative; z-index:-1; width:100px; height:100px; background:orange; }
#isolated { position:absolute; isolation:isolate; left:20px; top:150px; width:100px; height:80px; background:yellow; }
#local { position:absolute; z-index:-1; left:10px; top:10px; width:70px; height:50px; background:magenta; }
#inside { margin-left:30px; margin-top:25px; width:30px; height:20px; background:lime; }
#word { position:absolute; display:block; left:160px; top:110px; z-index:-1; }
</style></head><body><div id="owner">
<div id="anchor"><div id="high"></div><div id="low"></div><span style="font:20px monospace;color:teal"><span id="word">Layer</span></span></div><div id="ink"></div>
<div id="clipper"><div id="clipped"></div></div>
<div id="isolated"><div id="local"></div><div id="inside"></div></div>
</div></body></html>
