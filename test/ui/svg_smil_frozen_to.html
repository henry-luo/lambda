<!doctype html><html><head><style>html,body{margin:0}button{position:absolute;top:90px;width:58px;height:30px}</style></head><body><svg id="scene" width="500" height="70"><rect id="rect" x="10" y="10" width="20" height="40" fill="red"><animate id="lower" attributeName="x" by="80" dur="4s" fill="freeze"/><animate id="upper" attributeName="x" to="110" dur="2s" end="1s" fill="freeze"/></rect></svg><button id="sample0" style="left:5px">0s</button><button id="sample1" style="left:70px">0.5s</button><button id="sample2" style="left:135px">1s</button><button id="sample3" style="left:200px">1.5s</button><button id="sample4" style="left:265px">2s</button><button id="sample5" style="left:330px">3s</button><button id="sample6" style="left:395px">4s</button><button id="mutate" style="left:460px;width:35px">Set</button><script>var scene=document.getElementById("scene"),rect=document.getElementById("rect");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){scene.setCurrentTime(t);scene.setAttribute("data-x",Math.round(rect.getBBox().x));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(1.5);};document.getElementById("sample4").onclick=function(){sample(2);};document.getElementById("sample5").onclick=function(){sample(3);};document.getElementById("sample6").onclick=function(){sample(4);};document.getElementById("mutate").onclick=function(){rect.setAttribute("x","50");sample(4);};</script></body></html>
