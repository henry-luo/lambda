<!doctype html>
<style>body{margin:0;background:white}svg{display:block}img{position:absolute;left:200px;top:10px}</style>
<svg width="320" height="70">
  <defs>
    <filter id="alpha" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feComponentTransfer><feFuncR type="linear" slope="0"/><feFuncB id="blue" type="linear" slope="0" intercept="1"/><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    </filter>
    <filter id="channels" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix result="base" type="saturate" values="1"/>
      <feComponentTransfer in="base"><feFuncR type="linear" slope=".5" intercept=".25"/><feFuncG type="table" tableValues="1 0"/><feFuncB type="discrete" tableValues="0 1"/><feFuncA type="gamma" amplitude="1" exponent="1"/></feComponentTransfer>
    </filter>
    <filter id="identity" x="0" y="0" width="100%" height="100%"><feComponentTransfer><feFuncR type="identity"/><feFuncG type="table" tableValues=""/></feComponentTransfer></filter>
  </defs>
  <rect x="10" y="10" width="40" height="40" fill="red" filter="url(#alpha)"/>
  <rect x="70" y="10" width="40" height="40" fill="red" filter="url(#channels)"/>
  <rect x="130" y="10" width="40" height="40" fill="red" filter="url(#identity)"/>
</svg>
<img src="svg_image_assets/component-transfer.svg" width="40" height="40">
<button id="change">change</button>
<script>
document.getElementById('change').addEventListener('click',function(){document.getElementById('blue').setAttribute('intercept','0');});
</script>
