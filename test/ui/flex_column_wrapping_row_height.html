<!doctype html>
<html><head><meta charset="utf-8"><title>Column flex item that is a wrapping row</title>
<style>
html, body { margin: 0; height: 100%; }
/* a full-height column: header, a wrapping toolbar row, a flexible body, a footer */
#app { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#head { min-height: 64px; background: #eee; }
#bar { display: flex; flex-wrap: wrap; gap: 20px; padding: 18px; background: #ddf; }
#bar div { width: 300px; height: 50px; background: #99c; }
#body { flex: 1; min-height: 0; background: #fcc; }
#foot { min-height: 52px; background: #ccc; }
</style></head>
<body><div id="app">
  <div id="head"></div>
  <div id="bar"><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <div id="body"></div>
  <div id="foot"></div>
</div></body></html>
