<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DOM package range and number stepping</title>
  <style>
    body { font: 16px sans-serif; margin: 0; }
    input { display: block; margin: 8px; }
    #slider { width: 200px; }
  </style>
</head>
<body>
  <form id="form" action="#submitted">
    <input id="before" name="before" value="seed">
    <input id="slider" name="volume" type="range" min="0" max="100" step="10" value="50">
    <input id="fine" name="fine" type="range" min="-1" max="1" step="0.5" value="0">
    <input id="count" name="count" type="number" min="0" max="5" step="1" value="2">
    <input id="blocked" name="blocked" type="range" min="0" max="100" value="50">
  </form>
  <output id="inputs">0</output>
  <output id="changes">0</output>
  <script>
    let inputs = 0;
    let changes = 0;
    const slider = document.getElementById('slider');
    slider.addEventListener('input', () => {
      document.getElementById('inputs').textContent = String(++inputs);
    });
    slider.addEventListener('change', () => {
      document.getElementById('changes').textContent = String(++changes);
    });
    // An author that cancels the keydown must suppress the UA step entirely.
    document.getElementById('blocked')
      .addEventListener('keydown', event => event.preventDefault());
  </script>
</body>
</html>
