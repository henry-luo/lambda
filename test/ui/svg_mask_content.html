<!DOCTYPE html><html><head><style>
@font-face{font-family:SVG-Ahem;src:url('../layout/data/font/Ahem.ttf')}
html,body{margin:0;background:white}svg{position:absolute;left:0;top:0;font-family:SVG-Ahem;font-size:40px}
</style></head><body><svg width="640" height="360">
 <defs>
  <mask id="red" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60"><rect width="100" height="60" fill="red" opacity=".5"/></mask>
  <mask id="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60" mask-type="alpha"><rect width="100" height="60" fill="blue" opacity=".5"/></mask>
  <mask id="gray" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60"><rect width="100" height="60" fill="rgb(128 128 128)"/></mask>
  <mask id="linear" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60" color-interpolation="linearRGB"><rect width="100" height="60" fill="rgb(128 128 128)"/></mask>
  <mask id="image-alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60" mask-type="alpha"><image width="100" height="60" href="svg_image_assets/mask_rgba.png"/></mask>
  <mask id="image-luma" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60"><image width="100" height="60" href="svg_image_assets/mask_rgba.png"/></mask>
  <mask id="text" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60"><text x="0" y="40" fill="white">A</text></mask>
  <mask id="bbox-region" maskContentUnits="objectBoundingBox" x="25%" y="25%" width="50%" height="50%"><rect width="1" height="1" fill="white"/></mask>
  <mask id="stroke" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60"><path d="M10 30H90" fill="none" stroke="white" stroke-width="20"/></mask>
  <mask id="cycle" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="60"><rect width="100" height="60" fill="white" mask="url(#cycle)"/></mask>
 </defs>
 <g transform="translate(0 0)"><rect width="100" height="60" fill="blue" mask="url(#red)"/></g>
 <g transform="translate(120 0)"><rect width="100" height="60" fill="blue" mask="url(#alpha)"/></g>
 <g transform="translate(240 0)"><rect width="100" height="60" fill="blue" mask="url(#gray)"/></g>
 <g transform="translate(360 0)"><rect width="100" height="60" fill="blue" mask="url(#linear)"/></g>
 <g transform="translate(480 0)"><image width="100" height="60" href="svg_image_assets/mask_rgba.png"/></g>
 <g transform="translate(0 100)"><rect width="100" height="60" fill="blue" mask="url(#image-alpha)"/></g>
 <g transform="translate(120 100)"><rect width="100" height="60" fill="blue" mask="url(#image-luma)"/></g>
 <g transform="translate(240 100)"><rect width="100" height="60" fill="blue" mask="url(#text)"/></g>
 <rect x="20" y="20" width="100" height="60" fill="blue" transform="translate(360 100)" mask="url(#bbox-region)"/>
 <g transform="translate(480 100)"><rect width="100" height="60" fill="blue" mask="url(#stroke)"/></g>
 <g transform="translate(0 200)"><rect width="100" height="60" fill="blue" mask="url(#missing)"/></g>
 <g transform="translate(120 200)"><rect width="100" height="60" fill="blue" mask="url(#cycle)"/></g>
</svg></body></html>
