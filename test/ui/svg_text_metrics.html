<!DOCTYPE html><html><head><style>
@font-face{font-family:SVG-Ahem;src:url('../layout/data/font/Ahem.ttf');}html,body{margin:0;background:white;}svg{position:absolute;left:0;top:0;font-family:SVG-Ahem;font-size:20px;}
</style></head><body><svg width="380" height="250">
