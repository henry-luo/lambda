<!doctype html>
<html><head><meta charset="utf-8"><title>Inherited flex line height</title>
<style>
@font-face { font-family: Ahem; src: url('../layout/data/font/Ahem.ttf'); }
body { margin: 0; }
.owner { font: 20px/normal Ahem; }
.group { display: flex; flex-direction: column; align-items: flex-start; }
.label { font-size: 10px; }
#length { line-height: 24px; }
#number { line-height: 2.5; }
#percent { line-height: 150%; }
</style></head><body>
<div id="normal" class="owner"><div class="group"><span class="label">small</span><div class="tail">tail</div></div></div>
<div id="length" class="owner"><div class="group"><span class="label">small</span></div></div>
<div id="number" class="owner"><div class="group"><span class="label">small</span></div></div>
<div id="percent" class="owner"><div class="group"><span class="label">small</span></div></div>
</body></html>
