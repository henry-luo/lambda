<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sticky boxes follow the scroll</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .top { position: sticky; top: 0; background: #cde; padding: 8px; }
  .bottom { position: sticky; bottom: 0; background: #edc; padding: 8px; }
  p { margin: 0; padding: 20px; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>
  <div class="top">sticky top</div>
  <p id="r1">row 1</p><p id="r2">row 2</p><p id="r3">row 3</p><p id="r4">row 4</p>
  <p id="r5">row 5</p><p id="r6">row 6</p><p id="r7">row 7</p><p id="r8">row 8</p>
  <p id="r9">row 9</p><p id="r10">row 10</p><p id="r11">row 11</p><p id="r12">row 12</p>
  <p id="r13">row 13</p><p id="r14">row 14</p><p id="r15">row 15</p><p id="r16">row 16</p>
  <p id="r17">row 17</p><p id="r18">row 18</p><p id="r19">row 19</p><p id="r20">row 20</p>
  <div class="bottom">sticky bottom</div>
</body>
</html>
