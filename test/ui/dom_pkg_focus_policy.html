<!doctype html>
<html>
<head>
  <style>
    body { margin: 0; font: 16px sans-serif; }
    button, input, textarea { display: block; margin: 12px; }
    #spacer { height: 1200px; }
  </style>
</head>
<body>
  <input id="zero-before" value="before">
  <button id="tab3" tabindex="3">third</button>
  <button id="tab1a" tabindex="1">first-a</button>
  <button id="tab1b" tabindex="1">first-b</button>
  <button id="negative" tabindex="-1">programmatic only</button>
  <textarea id="auto-text" autofocus>autofocus textarea</textarea>
  <button id="zero-after">zero-after</button>
  <div id="spacer"></div>
  <button id="far">far target</button>
</body>
</html>
