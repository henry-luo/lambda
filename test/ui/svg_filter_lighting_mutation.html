<!doctype html><html><head><style>html,body{margin:0;background:white}svg{display:block}#advance{position:absolute;left:0;top:320px;width:100px;height:30px}</style></head><body><svg width="840" height="320"><defs><linearGradient id="height" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="white" stop-opacity="0"/><stop offset="1" stop-color="white"/></linearGradient><filter id="diffuse-distant" filterUnits="userSpaceOnUse" x="10" y="20" width="100" height="100" color-interpolation-filters="sRGB"><feDiffuseLighting id="diffuse" surfaceScale="10" diffuseConstant=".8" lighting-color="white"><feDistantLight id="distant" azimuth="0" elevation="30"/></feDiffuseLighting></filter><filter id="specular-distant" filterUnits="userSpaceOnUse" x="150" y="20" width="100" height="100" color-interpolation-filters="sRGB"><feSpecularLighting id="specular" surfaceScale="10" specularConstant=".5" specularExponent="4" lighting-color="red"><feDistantLight azimuth="0" elevation="30"/></feSpecularLighting></filter><filter id="diffuse-point" filterUnits="userSpaceOnUse" x="290" y="20" width="100" height="100" color-interpolation-filters="sRGB"><feDiffuseLighting surfaceScale="10" lighting-color="#40a0ff"><fePointLight id="point" x="340" y="70" z="100"/></feDiffuseLighting></filter><filter id="diffuse-spot" filterUnits="userSpaceOnUse" x="430" y="20" width="100" height="100" color-interpolation-filters="sRGB"><feDiffuseLighting surfaceScale="10" lighting-color="#00ff00"><feSpotLight id="spot" x="480" y="70" z="100" pointsAtX="480" pointsAtY="70" pointsAtZ="0" specularExponent="8" limitingConeAngle="20"/></feDiffuseLighting></filter><filter id="specular-point" filterUnits="userSpaceOnUse" x="570" y="20" width="100" height="100" color-interpolation-filters="sRGB"><feSpecularLighting surfaceScale="10" specularConstant=".5" specularExponent="8" lighting-color="#00ff00"><fePointLight x="620" y="70" z="100"/></feSpecularLighting></filter><filter id="specular-spot" filterUnits="userSpaceOnUse" x="710" y="20" width="100" height="100" color-interpolation-filters="sRGB"><feSpecularLighting surfaceScale="10" specularConstant=".5" specularExponent="8" lighting-color="blue"><feSpotLight x="760" y="70" z="100" pointsAtX="760" pointsAtY="70" pointsAtZ="0" limitingConeAngle="20"/></feSpecularLighting></filter><filter id="bump" filterUnits="userSpaceOnUse" x="20" y="170" width="120" height="100" color-interpolation-filters="sRGB"><feDiffuseLighting surfaceScale="5" kernelUnitLength="2" lighting-color="white"><feDistantLight azimuth="0" elevation="45"/></feDiffuseLighting></filter></defs><rect x="10" y="20" width="100" height="100" fill="red" filter="url(#diffuse-distant)"/><rect x="150" y="20" width="100" height="100" fill="red" filter="url(#specular-distant)"/><rect x="290" y="20" width="100" height="100" fill="red" filter="url(#diffuse-point)"/><rect x="430" y="20" width="100" height="100" fill="red" filter="url(#diffuse-spot)"/><rect x="570" y="20" width="100" height="100" fill="red" filter="url(#specular-point)"/><rect x="710" y="20" width="100" height="100" fill="red" filter="url(#specular-spot)"/><rect x="20" y="170" width="120" height="100" fill="url(#height)" filter="url(#bump)"/></svg><button id="advance" data-step="0">advance</button><script>
