<!doctype html><meta charset=utf-8><style>
body {margin:0;background:white}
#controls {position:fixed;left:200px;top:0;z-index:20}
button {display:block;width:120px;height:25px}
#spacer {height:2000px}
#auto {content-visibility:auto;contain-intrinsic-size:auto 40px;width:100px}
#child {height:120px;background:green}
#hidden {content-visibility:hidden;contain-intrinsic-size:80px}
</style>
<div id=controls><button id=select>select auto text</button><button id=clear>clear selection</button>
<button id=scroll-hidden>scroll hidden</button></div>
<div id=spacer></div><div id=auto><div id=child>selectable text</div></div>
<div id=hidden><div id=hidden-child>hidden text</div></div>
<script>
function byId(id) {return document.getElementById(id)}
byId('select').onclick=function(){window.getSelection().selectAllChildren(byId('child'))};
byId('clear').onclick=function(){window.getSelection().removeAllRanges()};
byId('scroll-hidden').onclick=function(){byId('hidden-child').scrollIntoView()};
</script>
