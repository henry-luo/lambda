<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0}#root{top:0}#embedded{top:90px}button{position:absolute;top:240px;width:60px;height:30px}</style></head><body>
<svg id="root" width="200" height="60" viewBox="0 0 200 60" preserveAspectRatio="none"><rect width="200" height="60" fill="blue"/><animate attributeName="width" from="200" to="400" dur="2s" fill="freeze"/></svg>
<svg id="embedded" width="480" height="130"><foreignObject id="foreign" x="10" y="10" width="120" height="100"><div id="html" xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;background:red"></div></foreignObject><animate id="resize" href="#foreign" attributeName="width" from="120" to="240" dur="2s" fill="freeze"/></svg>
<button id="sample0" style="left:10px">0s</button><button id="sample1" style="left:90px">0.5s</button><button id="sample2" style="left:170px">1s</button><button id="sample3" style="left:250px">1.5s</button><button id="sample4" style="left:330px">2s</button><button id="report" style="left:410px">Read</button><script>var root=document.getElementById("root"),embedded=document.getElementById("embedded");if(typeof root.pauseAnimations==="function"){root.pauseAnimations();embedded.pauseAnimations();root.setCurrentTime(0);embedded.setCurrentTime(0);}function sample(t){if(typeof root.setCurrentTime!=="function"){root.setAttribute("data-widths","unsupported");return;}root.setCurrentTime(t);embedded.setCurrentTime(t);}function report(){root.setAttribute("data-widths",Math.round(root.getBoundingClientRect().width)+","+Math.round(document.getElementById("html").getBoundingClientRect().width)+","+root.getAttribute("width")+","+document.getElementById("foreign").getAttribute("width"));}document.getElementById("report").onclick=report;document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(1.5);};document.getElementById("sample4").onclick=function(){sample(2);};</script></body></html>
