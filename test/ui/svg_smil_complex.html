<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}#viewport{left:220px;top:10px}button{position:absolute;top:240px;width:60px;height:30px}</style></head><body><svg id="scene" width="480" height="220"><defs><linearGradient id="gradient"><stop stop-color="red"/><stop offset="1" stop-color="blue"/><animate attributeName="x2" from="100%" to="50%" dur="2s" fill="freeze"/></linearGradient></defs><polygon id="points" points="10,10 40,10 10,40" fill="red"><animate attributeName="points" from="10,10 40,10 10,40" to="110,10 140,10 110,40" dur="2s" fill="freeze"/></polygon><path id="path" d="M10 70 L40 70 L10 100 Z" fill="red"><animate attributeName="d" from="M10 70 L40 70 L10 100 Z" to="M110 70 L140 70 L110 100 Z" dur="2s" fill="freeze"/></path><rect x="10" y="130" width="180" height="40" fill="url(#gradient)"/></svg><svg id="viewport" width="200" height="60" viewBox="0 0 200 60"><rect x="80" y="10" width="40" height="40" fill="blue"/><animate attributeName="viewBox" from="0 0 200 60" to="0 0 400 120" dur="2s" fill="freeze"/></svg><button id="sample0" style="left:10px">0s</button><button id="sample1" style="left:90px">0.5s</button><button id="sample2" style="left:170px">1s</button><button id="sample3" style="left:250px">1.5s</button><button id="sample4" style="left:330px">2s</button><script>var scene=document.getElementById("scene"),viewport=document.getElementById("viewport");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();viewport.pauseAnimations();scene.setCurrentTime(0);viewport.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-bounds","unsupported");return;}scene.setCurrentTime(t);viewport.setCurrentTime(t);scene.setAttribute("data-bounds",Math.round(document.getElementById("points").getBBox().x)+","+Math.round(document.getElementById("path").getBBox().x));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(1.5);};document.getElementById("sample4").onclick=function(){sample(2);};</script></body></html>
