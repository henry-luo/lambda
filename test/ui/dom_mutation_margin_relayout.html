<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Collapsed margins survive a retained relayout</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  /* clean blocks whose sibling margins collapse, re-laid out by a later mutation */
  #article p { margin: 0.5em 0; }
  #article h3 { font-size: 1.2em; margin: 1.1em 0 0.4em; }
</style>
</head>
<body>
<article id="article">
  <p>First paragraph.</p>
  <h3 id="heading">Heading</h3>
  <p id="note">note</p>
</article>
<button id="go">go</button>
<script>
document.getElementById('go').addEventListener('click', function () {
  document.getElementById('note').textContent = 'note changed';
});
</script>
</body>
</html>
