<!doctype html><html><head><style>html,body{margin:0}button{position:absolute;top:240px;width:60px;height:30px}</style></head><body>
<svg id="scene" width="420" height="230">
 <defs><linearGradient id="spread" gradientUnits="userSpaceOnUse" x1="10" x2="30"><stop stop-color="red"/><stop offset="1" stop-color="blue"/><animate attributeName="spreadMethod" to="repeat" calcMode="discrete" dur="2s" fill="freeze"/></linearGradient></defs>
 <rect id="discrete" x="10" y="10" width="20" height="20" fill="red"><animate attributeName="x" to="110" calcMode="discrete" dur="2s" fill="freeze"/></rect>
 <rect id="keyed" x="10" y="50" width="20" height="20" fill="red"><animate attributeName="x" to="110" calcMode="discrete" keyTimes="0;.75" dur="2s" fill="freeze"/></rect>
 <rect id="indefinite" x="10" y="90" width="20" height="20" fill="red"><animate attributeName="x" values="20;100" keyTimes=".5;1" end="2s" fill="freeze"/></rect>
 <rect x="10" y="130" width="120" height="20" fill="url(#spread)"/>
 <image x="200" y="170" width="100" height="20" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22 viewBox=%220 0 10 10%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22red%22/%3E%3C/svg%3E"><animate attributeName="preserveAspectRatio" to="none" calcMode="discrete" dur="2s" fill="freeze"/></image>
</svg>
<button id="zero" style="left:10px">0</button><button id="half" style="left:80px">0.5</button><button id="one" style="left:150px">1</button><button id="late" style="left:220px">1.5</button><button id="two" style="left:290px">2</button><button id="rewind" style="left:360px">rewind</button>
<script>var scene=document.getElementById("scene");scene.pauseAnimations();scene.setCurrentTime(0);function wire(id,time){document.getElementById(id).onclick=function(){scene.setCurrentTime(time);};}wire("zero",0);wire("half",.5);wire("one",1);wire("late",1.5);wire("two",2);wire("rewind",0);</script></body></html>
