<style>
  #snap { scroll-snap-type: y proximity; }
  #snap-child { scroll-snap-type: inherit; scroll-snap-align: start; }
  #overscroll { overscroll-behavior: contain; overscroll-behavior-y: auto; }
</style>
<div id="snap"><div id="snap-child"></div></div>
<div id="overscroll"></div>
