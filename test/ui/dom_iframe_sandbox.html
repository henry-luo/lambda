<!doctype html>
<!-- MQ11 (vibe/Lambda_Demo_Mail.md): a sandboxed frame loads with scripting
     disabled, nested frames inherit it, and allow-scripts does not lift it yet. -->
<html><head><meta charset="utf-8"><style>iframe{display:block;width:420px;height:150px;border:1px solid #888}</style></head>
<body>
<p id="host">host</p>
<script>document.getElementById('host').setAttribute('data-ran', 'yes')</script>
<iframe id="open" srcdoc="<p id='out'>before</p><script>document.getElementById('out').textContent = 'ran'</script>"></iframe>
<iframe id="sandboxed" sandbox srcdoc="<p id='out'>before</p><script>document.getElementById('out').textContent = 'ran'</script><noscript><p id='ns'>no script</p></noscript><button id='btn' onclick='this.textContent = &quot;clicked&quot;'>press</button><iframe id='inner' srcdoc='<p id=&quot;deep&quot;>before</p><script>document.getElementById(&quot;deep&quot;).textContent = &quot;ran&quot;</script>'></iframe>"></iframe>
<iframe id="allowed" sandbox="allow-same-origin allow-scripts" srcdoc="<p id='out'>before</p><script>document.getElementById('out').textContent = 'ran'</script>"></iframe>
</body></html>
