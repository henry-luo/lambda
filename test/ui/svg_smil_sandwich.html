<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:350px;width:50px;height:30px}</style></head><body><svg id="scene" width="520" height="340" color="blue">
<rect id="priority" x="10" y="10" width="20" height="30" fill="red"><animate attributeName="x" begin="2s" from="10" to="110" dur="2s" fill="freeze"/><animate attributeName="x" from="10" to="50" dur="4s" fill="freeze"/></rect>
<rect id="tie" x="10" y="60" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="30" dur="2s" fill="freeze"/><animate attributeName="x" from="50" to="90" dur="2s" fill="freeze"/></rect>
<rect id="to" x="10" y="110" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" dur="4s" fill="freeze"/><animate attributeName="x" begin="1s" to="210" dur="3s" fill="freeze"/></rect>
<g id="default" transform="translate(0 170)"><rect x="10" width="20" height="30" fill="red"/><animateTransform attributeName="transform" from="0 170" to="100 170" dur="2s" fill="freeze"/></g>
<g id="addition" transform="translate(10 220)"><rect width="20" height="30" fill="red"/><animateTransform attributeName="transform" type="translate" from="0 0" to="100 0" additive="sum" dur="2s" fill="freeze"/></g>
<g transform="translate(310 100)"><g id="scale"><rect width="20" height="10" fill="blue"/><animateTransform attributeName="transform" type="scale" from="1" to="2" dur="1s" repeatCount="2" accumulate="sum" fill="freeze"/></g></g>
<rect x="310" y="170" width="80" height="30" fill="red"><animate attributeName="fill" from="red" to="currentColor" dur="2s" fill="freeze"/></rect>
<rect x="310" y="220" width="80" height="30" fill="red" color-interpolation="linearRGB"><animate attributeName="fill" from="red" to="blue" dur="2s" fill="freeze"/></rect>
<rect x="310" y="270" width="80" height="30" fill="rgb(50,0,0)"><animate attributeName="fill" by="rgb(100,0,0)" dur="2s" fill="freeze"/></rect>
</svg><button id="sample0" style="left:10px">0s</button><button id="sample1" style="left:70px">0.5s</button><button id="sample2" style="left:130px">1s</button><button id="sample3" style="left:190px">1.5s</button><button id="sample4" style="left:250px">2s</button><button id="sample5" style="left:310px">3s</button><button id="sample6" style="left:370px">4s</button><button id="sample7" style="left:430px">5s</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-values","unsupported");return;}scene.setCurrentTime(t);var ids=["priority","tie","to"],values=[];for(var i=0;i<ids.length;i++){values.push(Math.round(document.getElementById(ids[i]).getBBox().x));}values.push(Math.round(document.getElementById("default").getScreenCTM().e));values.push(Math.round(document.getElementById("addition").getScreenCTM().e));values.push(Math.round(document.getElementById("scale").getScreenCTM().a*10));scene.setAttribute("data-values",values.join(","));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(1.5);};document.getElementById("sample4").onclick=function(){sample(2);};document.getElementById("sample5").onclick=function(){sample(3);};document.getElementById("sample6").onclick=function(){sample(4);};document.getElementById("sample7").onclick=function(){sample(5);};</script></body></html>
