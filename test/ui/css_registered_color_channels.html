<!doctype html><style>@property --test{syntax:"<color>";inherits:true;initial-value:magenta}body{margin:0}.box{width:20px;height:10px;background:var(--test)}</style><button id="inspect">inspect</button><div class="box" id="c2" style="--test:rgb(12.5% 22.2% 33.3% / 50%)"></div><div class="box" id="c3" style="--test:#1234"></div><div class="box" id="c4" style="--test:#00000080"></div><div class="box" id="c8" style="--test:hsl(180 50 50)"></div><div class="box" id="c9" style="--test:rgb(1%, 2, 3)"></div><div class="box" id="c10" style="--test:rgb(1 2 3 4)"></div><div class="box" id="c11" style="--test:rgb(1 2 3 / .5 .6)"></div><div class="box" id="c12" style="--test:rgb(calc(10 + 20%) 0 0)"></div><div class="box" id="c13" style="--test:hsl(calc(1turn / 2) calc(25% + 25%) calc(20 + 30))"></div><div class="box" id="c14" style="--test:rgb(calc(infinity) calc(-infinity) calc(NaN))"></div><div class="box" id="c15" style="--test:hwb(30deg 80% 60%)"></div><div class="box" id="srgb" style="--test:color(srgb 100% 0 0 / 50%)"></div><div class="box" id="api" style="background:var(--api)"></div><script>CSS.registerProperty({name:"--api",syntax:"<color>",inherits:false,initialValue:"hsl(calc(1turn / 2) 100% 50%)"});document.getElementById("inspect").onclick=function(){var b=this;b.setAttribute("data-c2",getComputedStyle(document.getElementById("c2")).getPropertyValue("--test"));b.setAttribute("data-c3",getComputedStyle(document.getElementById("c3")).getPropertyValue("--test"));b.setAttribute("data-c4",getComputedStyle(document.getElementById("c4")).getPropertyValue("--test"));b.setAttribute("data-c8",getComputedStyle(document.getElementById("c8")).getPropertyValue("--test"));b.setAttribute("data-c9",getComputedStyle(document.getElementById("c9")).getPropertyValue("--test"));b.setAttribute("data-c10",getComputedStyle(document.getElementById("c10")).getPropertyValue("--test"));b.setAttribute("data-c11",getComputedStyle(document.getElementById("c11")).getPropertyValue("--test"));b.setAttribute("data-c12",getComputedStyle(document.getElementById("c12")).getPropertyValue("--test"));b.setAttribute("data-c13",getComputedStyle(document.getElementById("c13")).getPropertyValue("--test"));b.setAttribute("data-c14",getComputedStyle(document.getElementById("c14")).getPropertyValue("--test"));b.setAttribute("data-c15",getComputedStyle(document.getElementById("c15")).getPropertyValue("--test"));b.setAttribute("data-srgb",getComputedStyle(document.getElementById("srgb")).getPropertyValue("--test"));b.setAttribute("data-api",getComputedStyle(document.getElementById("api")).getPropertyValue("--api"));};</script>
