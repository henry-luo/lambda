<!doctype html><meta charset=utf-8><title>Computed text spacing reaches paint</title><style>
@font-face{font-family:FixtureMono;src:url(../layout/data/font/LiberationMono-Regular.ttf)}
html,body{margin:0;background:white}.box{width:240px;height:24px;font:20px/24px FixtureMono;white-space:nowrap;color:red;overflow:hidden}.gap{display:inline-block}#word_owner{word-spacing:10px}
</style><button id=check>Check</button><button id=change>Increase inherited spacing</button><button id=negative_change>Negative inherited spacing</button><button id=reset>Reset inherited spacing</button><button id=restore>Restore stylesheet</button><output id=report></output><div id=word_owner><div class=box id=word style=""><span class=sample>ab cd</span></div></div><div class=box id=word_ref style=";word-spacing:0;text-overflow:clip">ab<span class=gap style="width:calc(1ch + 10px)"></span>cd</div><div class=box id=negative style="word-spacing:-5px"><span class=sample>ab cd</span></div><div class=box id=negative_ref style="word-spacing:-5px;word-spacing:0;text-overflow:clip">ab<span class=gap style="width:calc(1ch - 5px)"></span>cd</div><div class=box id=collapsed style="word-spacing:10px"><span class=sample>ab   cd</span></div><div class=box id=collapsed_ref style="word-spacing:10px;word-spacing:0;text-overflow:clip">ab<span class=gap style="width:calc(1ch + 10px)"></span>cd</div><div class=box id=preserved style="white-space:pre;word-spacing:10px"><span class=sample>ab   cd</span></div><div class=box id=preserved_ref style="white-space:pre;word-spacing:10px;word-spacing:0;text-overflow:clip">ab<span class=gap style="width:calc(3ch + 30px)"></span>cd</div><div class=box id=opacity style="word-spacing:10px;opacity:.5"><span class=sample>ab cd</span></div><div class=box id=opacity_ref style="word-spacing:10px;opacity:.5;word-spacing:0;text-overflow:clip">ab<span class=gap style="width:calc(1ch + 10px)"></span>cd</div><div class=box id=filter style="word-spacing:10px;filter:brightness(1)"><span class=sample>ab cd</span></div><div class=box id=filter_ref style="word-spacing:10px;filter:brightness(1);word-spacing:0;text-overflow:clip">ab<span class=gap style="width:calc(1ch + 10px)"></span>cd</div><div class=box id=rtl style="width:62px;word-spacing:10px;direction:rtl;text-overflow:ellipsis;color:blue"><span class=sample><span style=color:red>ab cd efgh</span></span></div><div class=box id=rtl_ref style="width:62px;word-spacing:10px;direction:rtl;text-overflow:ellipsis;color:blue;word-spacing:0;text-overflow:clip"><span dir=ltr>…<span style=color:red>efgh</span></span></div><div class=box id=ltr style="width:62px;word-spacing:10px;text-overflow:ellipsis;color:blue"><span class=sample><span style=color:red>ab cd efgh</span></span></div><div class=box id=ltr_ref style="width:62px;word-spacing:10px;text-overflow:ellipsis;color:blue;word-spacing:0;text-overflow:clip"><span style=color:red>ab<span class=gap style="width:calc(1ch + 10px)"></span></span>…</div><script>
const report=document.getElementById('report');let phase='initial';
function record(geometry){for(let id of ['word','negative','collapsed','preserved','opacity','filter','rtl','ltr']){const box=document.getElementById(id),style=getComputedStyle(box);report.setAttribute('data-'+phase+'-'+id+'-spacing',style.wordSpacing);report.setAttribute('data-'+phase+'-'+id+'-white-space',style.whiteSpace);if(geometry)report.setAttribute('data-'+phase+'-'+id+'-width',Math.round(box.querySelector('.sample').getBoundingClientRect().width));}}
document.getElementById('check').onclick=function(){record(true)};
function change(id,value,next){document.getElementById(id).onclick=function(){document.getElementById('word_owner').style.wordSpacing=value;phase=next;record(false)}}
change('change','20px','increased');change('negative_change','-5px','negative');change('reset','initial','reset');change('restore','','restored');
</script>
