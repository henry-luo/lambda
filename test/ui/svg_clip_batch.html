<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:white">
<svg width="180" height="100" viewBox="0 0 180 100">
  <defs>
    <clipPath id="left"><rect x="10" y="10" width="60" height="60"/></clipPath>
    <clipPath id="right"><rect x="90" y="10" width="60" height="60"/></clipPath>
  </defs>
  <g clip-path="url(#left)">
    <rect x="0" y="0" width="60" height="80" fill="red"/>
    <rect x="30" y="0" width="60" height="80" fill="blue" opacity="0.5"/>
  </g>
  <g clip-path="url(#right)">
    <rect x="50" y="0" width="100" height="80" fill="green"/>
  </g>
</svg>
</body></html>
