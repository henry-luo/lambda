<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:180px;width:90px;height:30px}</style></head><body>
<svg id="scene" width="420" height="160"><rect id="shape" x="10" y="10" width="30" height="30" fill="red"><animate id="timed" attributeName="x" from="10" to="110" begin="2s" dur="2s" fill="freeze"/><animate id="manual" attributeName="y" from="10" to="110" begin="indefinite" dur="indefinite"/></rect><set id="missing" href="#absent" attributeName="fill" to="blue" begin="indefinite"/></svg>
<button id="initial" style="left:10px">initial</button><button id="middle" style="left:110px">middle</button><button id="event" style="left:210px">event</button><button id="finish" style="left:310px">finish</button>
<script>var scene=document.getElementById('scene'),timed=document.getElementById('timed'),manual=document.getElementById('manual');scene.pauseAnimations();scene.setCurrentTime(0);

document.getElementById('event').onclick=function(){var ev=document.createEvent('TimeEvent');if(typeof ev.initTimeEvent!=='function'){scene.setAttribute('data-event','unsupported');return;}ev.initTimeEvent('repeatEvent',window,'4294967299');ev.detail=99;ev.view=null;var conversion=failName(function(){ev.initTimeEvent('changed',null,{valueOf:function(){throw new TypeError('detail');}});});var atomic=[conversion,ev.type,ev.detail];var observations=[];manual.addEventListener('repeatEvent',function(e){observations.push(e.type,e.detail,e.view===window,e.bubbles,e.cancelable,e.isTrusted);e.initTimeEvent('ignored',null,9);observations.push(e.type,e.detail);});manual.dispatchEvent(ev);scene.setAttribute('data-event',observations.concat(atomic).join(','));};
document.getElementById('finish').onclick=function(){scene.setCurrentTime(10);scene.setAttribute('data-finish',typeof timed.getStartTime==='function'?failName(function(){timed.getStartTime();}):'unsupported');};</script></body></html>
