<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:330px;width:60px;height:30px}</style></head><body><svg id="scene" width="480" height="320"><rect id="number" x="10" y="10" width="20" height="30" fill="red"><animate attributeName="x" from="bad" to="110" dur="2s" fill="freeze"/></rect><rect id="discrete" x="10" y="55" width="20" height="30" fill="red"><animate attributeName="x" to="110" calcMode="discrete" dur="2s" fill="freeze"/></rect><rect id="mode" x="10" y="100" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" calcMode=" linear " dur="2s" fill="freeze"/></rect><rect id="trailing" x="10" y="145" width="20" height="30" fill="red"><animate attributeName="x" values="10;110;" dur="2s" fill="freeze"/></rect><rect id="initial"  y="190" width="20" height="30" fill="red"><animate attributeName="x" to="100" dur="2s" fill="freeze"/></rect><rect x="10" y="235" width="40" height="30" fill="green"><animate attributeName="fill" from="red" to="invalid-color" dur="2s" fill="freeze"/></rect><polygon id="list" points="10,280 40,280 10,310" fill="red"><animate attributeName="points" from="10,280 40,280 10,310" by="100,0 100,0 100,0" dur="2s" fill="freeze"/></polygon></svg><button id="sample0" style="left:10px">0s</button><button id="sample1" style="left:90px">0.5s</button><button id="sample2" style="left:170px">1s</button><button id="sample3" style="left:250px">1.5s</button><button id="sample4" style="left:330px">2s</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-values","unsupported");return;}scene.setCurrentTime(t);var names=["number","discrete","mode","trailing","initial","list"],values=[];for(var i=0;i<names.length;i++){values.push(Math.round(document.getElementById(names[i]).getBBox().x));}scene.setAttribute("data-values",values.join(","));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(1.5);};document.getElementById("sample4").onclick=function(){sample(2);};</script></body></html>
