<!doctype html>
<style>
  body { margin: 0; }
  .host { position: relative; width: 100%; max-width: 600px; height: 300px; }
  .column { display: flex; flex-direction: column; width: 200px; }
  .sized { position: absolute; right: 20px; top: 20px; padding: 12px 32px;
           border: 0; border-radius: 12px; font: 20px/24px Ahem; display: inline-block;
           white-space: nowrap; box-sizing: border-box; background: blue; color: white; }
  #stretched { left: 20px; top: 80px; }
  #native { top: 140px; }
  #generated { top: 200px; }
  #generated::before { content: 'WORD'; }
  #change { position: absolute; top: 260px; }
</style>
<div class="host">
  <div class="column">
    <button class="sized" id="auto">WORD</button>
    <button class="sized" id="stretched">WORD</button>
    <input class="sized" id="native" type="button" value="WORD">
    <button class="sized" id="generated"></button>
  </div>
  <button id="change">Longer label</button>
</div>
<script>
  document.getElementById('change').addEventListener('click', function () {
    document.getElementById('auto').textContent = 'WORDWORD';
  });
</script>
