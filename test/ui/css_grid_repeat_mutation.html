<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0}button{height:24px}.grid{display:grid;width:120px;justify-content:start;align-content:start;grid-template-rows:10px;grid-auto-columns:7px}.grid>div{grid-column:-2;min-width:0}
#owner{font-size:10px;--amount:calc(20px / 1em)}#variable{grid-template-columns:70px;grid-template-columns:repeat(var(--amount),[s] 10px [e])}
#source{font-size:10px;grid-template-columns:repeat(calc(20px / 1em),[s] 10px [e])}#inherited{font-size:30px;grid-template-columns:inherit}
#fallback{grid-template-columns:repeat(var(--missing,min(2,3)),[s] 10px [e])}#rounded{grid-template-columns:repeat(clamp(1,2.5,4),[s] 10px [e])}
</style>
<button id="check">Check</button><button id="font">Font</button><button id="changed">Changed</button><button id="value">Value</button><button id="valued">Valued</button><button id="invalid">Invalid</button><button id="invalided">Invalided</button><button id="restore">Restore</button><button id="restored">Restored</button><output id="report"></output>
<div id="owner"><div id="variable" class="grid"><div></div></div></div>
<div id="source"><div id="inherited" class="grid"><div></div></div></div>
<div id="fallback" class="grid"><div></div></div><div id="rounded" class="grid"><div></div></div>
<script>
(function(){
 var report=document.getElementById('report');
 function record(prefix){
  ['variable','inherited','fallback','rounded'].forEach(function(id){
   var grid=document.getElementById(id),style=getComputedStyle(grid),g=grid.getBoundingClientRect(),r=grid.firstChild.getBoundingClientRect();
   report.setAttribute('data-'+prefix+id+'-columns',style.gridTemplateColumns);
   report.setAttribute('data-'+prefix+id+'-template',style.gridTemplate);
   report.setAttribute('data-'+prefix+id+'-rect',[r.x-g.x,r.width].join(','));
  });
 }
 document.getElementById('check').onclick=function(){record('');};
 document.getElementById('font').onclick=function(){document.getElementById('owner').style.fontSize='20px';document.getElementById('source').style.fontSize='5px';};
 document.getElementById('changed').onclick=function(){record('changed-');};
 document.getElementById('value').onclick=function(){document.getElementById('owner').style.setProperty('--amount','calc(2.5)');};
 document.getElementById('valued').onclick=function(){record('valued-');};
 document.getElementById('invalid').onclick=function(){document.getElementById('owner').style.setProperty('--amount','2px');};
 document.getElementById('invalided').onclick=function(){record('invalid-');};
 document.getElementById('restore').onclick=function(){document.getElementById('owner').style.fontSize='10px';document.getElementById('source').style.fontSize='10px';document.getElementById('owner').style.removeProperty('--amount');};
 document.getElementById('restored').onclick=function(){record('restored-');};
})();
</script>
