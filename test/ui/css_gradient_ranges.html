<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:white}button{height:24px}#host{position:absolute;left:0;top:72px;font-size:4px}#linear{width:48px;height:32px;background-image:linear-gradient(to right,red calc(-6em),blue 100%)}#radial{position:absolute;left:160px;top:72px;width:48px;height:32px;font-size:4px;background-image:radial-gradient(circle 16px,red calc(-2em),blue 100%)}</style>
<button id=reset>Reset</button><button id=font>Font</button><button id=wide>Width</button><button id=overshoot>Overshoot</button><button id=hard>Hard stops</button><button id=radialfont>Radial font</button><div id=host><div id=linear></div></div><div id=radial></div>
<script>(function(){var host=document.getElementById('host'),linear=document.getElementById('linear'),radial=document.getElementById('radial');document.getElementById('reset').onclick=function(){host.style.fontSize='4px';linear.style.width='48px';linear.style.backgroundImage='linear-gradient(to right,red calc(-6em),blue 100%)';radial.style.fontSize='4px';radial.style.backgroundImage='radial-gradient(circle 16px,red calc(-2em),blue 100%)'};document.getElementById('font').onclick=function(){host.style.fontSize='8px'};document.getElementById('wide').onclick=function(){linear.style.width='96px'};document.getElementById('overshoot').onclick=function(){linear.style.width='48px';linear.style.backgroundImage='linear-gradient(to right,red 0%,blue 200%)'};document.getElementById('hard').onclick=function(){linear.style.backgroundImage='linear-gradient(to right,red -50%,red 50%,blue 50%,blue 150%)'};document.getElementById('radialfont').onclick=function(){radial.style.fontSize='8px'};})();</script>
