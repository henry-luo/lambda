<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}#nested{position:absolute;left:30px;top:20px;width:80px;height:40px}#turned-svg{position:absolute;left:15px;top:5px;width:60px;height:30px}</style></head><body><svg id="scene" width="500" height="300" data-last="none" data-bounds="" onclick="this.setAttribute('data-last',event.target.id)"><g transform="translate(10 10) scale(2)"><foreignObject x="20" y="10" width="200" height="100"><div style="position:relative;width:100%;height:100%;background:yellow"><svg id="nested" width="80" height="40" viewBox="0 0 40 20"><rect id="nested-hit" width="40" height="20" fill="red"/></svg></div></foreignObject></g><g transform="translate(450 30) rotate(90)"><foreignObject width="90" height="60"><div style="position:relative;width:100%;height:100%;background:cyan"><svg id="turned-svg" width="60" height="30"><rect id="turned-hit" width="60" height="30" fill="blue"/></svg></div></foreignObject></g></svg><button id="report" style="position:absolute;left:20px;top:260px;width:80px;height:30px" onclick="var r=document.getElementById('nested-hit').getBoundingClientRect();document.getElementById('scene').setAttribute('data-bounds',[r.x,r.y,r.width,r.height].join(','))">report</button><button id="move" style="position:absolute;left:120px;top:260px;width:80px;height:30px" onclick="document.getElementById('nested').style.left='50px'">move</button></body></html>
