<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:310px;width:65px;height:30px}</style></head><body><svg id="scene" width="480" height="300"><rect id="moving" x="10" y="10" width="40" height="40" fill="red"><animate id="move" attributeName="x" from="10" to="110" dur="2s" fill="freeze"/></rect><circle id="color" cx="30" cy="100" r="20" fill="red"><animate attributeName="fill" from="red" to="blue" dur="2s" fill="freeze"/></circle><rect id="shown" x="10" y="150" width="40" height="40" fill="blue" visibility="hidden"><set attributeName="visibility" to="visible" begin="1s" dur="1s"/></rect><rect id="transformed" x="10" y="220" width="40" height="40" fill="lime"><animateTransform attributeName="transform" type="translate" from="0 0" to="100 0" dur="2s" repeatCount="2" fill="freeze"/></rect></svg><button id="sample0" style="left:10px">0s</button><button id="sample1" style="left:90px">0.5s</button><button id="sample2" style="left:170px">1s</button><button id="sample3" style="left:250px">2s</button><button id="sample4" style="left:330px">2.5s</button><button id="sample5" style="left:410px">4s</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-time","unsupported");return;}scene.setCurrentTime(t);scene.setAttribute("data-time",scene.getCurrentTime().toFixed(2));scene.setAttribute("data-base",document.getElementById("moving").getAttribute("x")+","+document.getElementById("color").getAttribute("fill"));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(2);};document.getElementById("sample4").onclick=function(){sample(2.5);};document.getElementById("sample5").onclick=function(){sample(4);};</script></body></html>
