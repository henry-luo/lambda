<!doctype html>
<html>
<head>
  <style>
    #pane {
      display: flex;
      flex-direction: column-reverse;
      width: 160px;
      height: 80px;
      overflow: auto;
    }
    #pane > div { flex: 0 0 50px; }
    #pane-x {
      display: flex;
      flex-direction: row-reverse;
      width: 80px;
      height: 50px;
      overflow: auto;
    }
    #pane-x > div { flex: 0 0 50px; }
  </style>
</head>
<body>
  <div id="pane">
    <div>first</div>
    <div>second</div>
    <div>third</div>
  </div>
  <div id="pane-x">
    <div>first</div>
    <div>second</div>
    <div>third</div>
  </div>
</body>
</html>
