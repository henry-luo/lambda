<!doctype html>
<style>
  body { margin: 0; }
  .outer { display: flex; flex-direction: column; align-items: flex-start; width: 100%; max-width: 800px; }
  .section { display: flex; flex-direction: column; width: 100%; gap: 24px; }
  .card { height: 290px; width: 100%; background: blue; }
  .ratio { display: flex; aspect-ratio: 16/9; width: 100%; max-width: 500px;
           flex-shrink: 0; background: red; }
  .ratio > div { width: 100%; height: 100%; }
  .tail { height: 24px; background: green; }
  .fixed-height { display: flex; flex-direction: column; align-items: flex-start; width: 400px; }
  .fixed-height > div { height: 100px; aspect-ratio: 2; background: purple; }
</style>
<div class="outer">
  <section class="section" id="section">
    <div class="card"></div>
    <div class="ratio" id="ratio"><div></div></div>
  </section>
  <div class="tail" id="tail">tail</div>
</div>
<div class="fixed-height">
  <div id="transferred">Several words give this content a larger intrinsic width than its ratio</div>
</div>
