<!DOCTYPE html>
<html>
<head><title>Inline background under a CSS transform</title></head>
<body style="margin:0;background:#f8f6f1;font:24px Arial, sans-serif">
<div style="position:absolute;left:0;top:0;width:800px;transform:translate(200px, 120px)">
  <p style="margin:0;color:#333">Rebuilt in <span id="pill" style="padding:0 12px;border-radius:8px;background:#ce422b;color:#ffffff;font-weight:700">Rust</span> and <span id="flat" style="padding:0 8px;background:#2f6fde;color:#ffffff">Lambda</span></p>
</div>
</body>
</html>
