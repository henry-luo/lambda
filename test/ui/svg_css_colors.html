<!doctype html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: white; }
svg { display: block; }
.html-color { position: absolute; top: 60px; width: 40px; height: 30px; }
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="100" viewBox="0 0 480 100">
  <rect x="10" y="10" width="40" height="40" fill="rgb(100%, 0%, 0%)"/>
  <rect x="60" y="10" width="40" height="40" style="fill: rgb(0% 100% 0%)"/>
  <rect x="110" y="10" width="40" height="40" fill="rebeccapurple"/>
  <rect x="160" y="10" width="40" height="40" fill="hsl(240, 100%, 50%)"/>
  <rect x="210" y="10" width="40" height="40" style="fill: hsl(120 100% 50% / 50%)"/>
  <rect x="260" y="10" width="40" height="40" fill="hsl(0.5turn 100% 50%)"/>
  <rect x="310" y="10" width="40" height="40" fill="hsla(-120, 100%, 50%, 0.5)"/>
  <rect x="360" y="10" width="40" height="40" fill="hsl(200grad 100% 50%)"/>
  <rect x="410" y="10" width="40" height="40" fill="hsl(3.141592653589793rad 100% 50%)"/>
</svg>
<div class="html-color" style="left:10px;background:rgb(100%, 0%, 0%)"></div>
<div class="html-color" style="left:60px;background:rgb(0% 100% 0%)"></div>
<div class="html-color" style="left:110px;background:rebeccapurple"></div>
<div class="html-color" style="left:160px;background:hsl(240, 100%, 50%)"></div>
</body></html>
