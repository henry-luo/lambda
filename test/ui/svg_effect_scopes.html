<!doctype html>
<html><head><style>
@font-face { font-family: Ahem; src: url('../layout/data/font/Ahem.ttf'); }
html,body { margin:0; background:white; }
svg { display:block; }
text { font-family:Ahem; font-size:40px; fill:blue; }
</style></head><body>
<svg width="640" height="360">
 <defs>
  <mask id="textHalf" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="100"><rect x="20" y="20" width="60" height="40" fill="white"/></mask>
  <clipPath id="textClip"><rect x="260" y="20" width="60" height="40"/></clipPath>
  <clipPath id="nestedHalf"><rect x="100" y="200" width="40" height="40"/></clipPath>
  <mask id="nestedMask" maskUnits="userSpaceOnUse" x="100" y="200" width="80" height="40"><rect x="100" y="200" width="40" height="40" fill="white"/></mask>
  <symbol id="styledSymbol" viewBox="0 0 80 40" fill="red" opacity=".5"><rect width="60" height="40"/><rect x="20" width="60" height="40"/></symbol>
  <clipPath id="rootHalf"><rect width="80" height="80"/></clipPath>
  <mask id="rootMask" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="80"><rect width="80" height="80" fill="white"/></mask>
 </defs>
 <text x="20" y="60"><tspan mask="url(#textHalf)">AAAA</tspan></text>
 <text x="260" y="60"><tspan clip-path="url(#textClip)">AAAA</tspan></text>
 <text x="500" y="60"><tspan opacity=".5">AA</tspan></text>
 <svg x="20" y="120" width="160" height="80" viewBox="100 200 80 40" clip-path="url(#nestedHalf)"><rect x="100" y="200" width="80" height="40" fill="blue"/></svg>
 <svg x="260" y="120" width="160" height="80" viewBox="100 200 80 40" mask="url(#nestedMask)"><rect x="100" y="200" width="80" height="40" fill="blue"/></svg>
 <use href="#styledSymbol" x="20" y="240" width="160" height="80" fill="blue"/>
 <g transform="translate(260 240)" opacity=".5"><rect width="120" height="80" fill="blue"/><rect x="40" width="120" height="80" fill="blue"/></g>
</svg>
<svg width="160" height="80" clip-path="url(#rootHalf)"><rect width="160" height="80" fill="blue"/></svg>
<svg width="160" height="80" mask="url(#rootMask)" style="position:absolute;left:240px;top:360px"><rect width="160" height="80" fill="blue"/></svg>
<svg width="160" height="80" opacity=".5" style="position:absolute;left:480px;top:360px"><rect width="120" height="80" fill="blue"/><rect x="40" width="120" height="80" fill="blue"/></svg>
</body></html>
