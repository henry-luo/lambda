<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:white}#box{width:48px;height:32px;background-image:linear-gradient(red,red),radial-gradient(blue,blue);background-size:8px 4px,48px 32px;background-repeat:no-repeat}button{display:block;margin-top:8px}</style><div id=box></div><button id=move>Move</button><button id=clear>Clear</button><button id=restore>Restore</button><button id=resize>Resize</button><script>var box=document.getElementById('box');document.getElementById('move').onclick=function(){box.style.backgroundPosition='right min(50%,3px) bottom max(10%,5px),0 0';};document.getElementById('clear').onclick=function(){box.style.backgroundImage='none';};document.getElementById('restore').onclick=function(){box.style.backgroundImage='linear-gradient(red,red),radial-gradient(blue,blue)';};var enlarged=false;document.getElementById('resize').onclick=function(){enlarged=!enlarged;box.style.backgroundSize=enlarged?'min(50%,16px) max(10%,8px),48px 32px':'calc(50% - 16px) calc(50% - 12px),48px 32px';};</script>
