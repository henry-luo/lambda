<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:420px;width:50px;height:30px}</style></head><body><svg id="scene" width="620" height="410"><rect id="begins" x="10" y="5" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="0s;1.5s" dur="1s" fill="freeze"/></rect><rect id="idle" x="10" y="55" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="0s;0.5s;1.5s" restart="whenNotActive" dur="1s" fill="freeze"/></rect><rect id="never" x="10" y="105" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="0s;0.5s;1.5s" restart="never" dur="1s" fill="freeze"/></rect><rect id="ends" x="10" y="155" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="0s;1.5s" end="0.75s;2.25s" dur="1s" fill="freeze"/></rect><rect id="repeatdur" x="10" y="205" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" repeatDur="3s" dur="1s" fill="freeze"/></rect><rect id="fraction" x="10" y="255" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" repeatCount="2.5" dur="1s" fill="freeze"/></rect><rect id="negative" x="10" y="305" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="-0.5s" dur="1s" fill="freeze"/></rect><rect id="maximum" x="10" y="355" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" repeatCount="5" max="1.5s" dur="1s" fill="freeze"/></rect></svg><button id="sample0" style="left:10px">0s</button><button id="sample1" style="left:70px">0.25s</button><button id="sample2" style="left:130px">0.5s</button><button id="sample3" style="left:190px">0.75s</button><button id="sample4" style="left:250px">1s</button><button id="sample5" style="left:310px">1.5s</button><button id="sample6" style="left:370px">2s</button><button id="sample7" style="left:430px">2.25s</button><button id="sample8" style="left:490px">2.5s</button><button id="sample9" style="left:550px">3s</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-values","unsupported");return;}scene.setCurrentTime(t);var names=["begins","idle","never","ends","repeatdur","fraction","negative","maximum"], values=[];for(var i=0;i<names.length;i++){values.push(Math.round(document.getElementById(names[i]).getBBox().x));}scene.setAttribute("data-values",values.join(","));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.25);};document.getElementById("sample2").onclick=function(){sample(0.5);};document.getElementById("sample3").onclick=function(){sample(0.75);};document.getElementById("sample4").onclick=function(){sample(1);};document.getElementById("sample5").onclick=function(){sample(1.5);};document.getElementById("sample6").onclick=function(){sample(2);};document.getElementById("sample7").onclick=function(){sample(2.25);};document.getElementById("sample8").onclick=function(){sample(2.5);};document.getElementById("sample9").onclick=function(){sample(3);};</script></body></html>
