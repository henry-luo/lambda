<!doctype html>
<meta charset="utf-8">
<title>DOM contenteditable collapsed typing state</title>
<div id="surface" contenteditable="true" tabindex="0">seed</div>
<button id="bold">bold</button>
<button id="insert">insert</button>
<div id="out"></div>
<script>
  var surface = document.getElementById('surface');
  var out = document.getElementById('out');
  ['bold', 'insert'].forEach(function(id) {
    document.getElementById(id).addEventListener('mousedown', function(event) {
      event.preventDefault();
    });
  });
  document.getElementById('bold').addEventListener('click', function() {
    out.textContent = 'bold:' + document.execCommand('bold', false, '') + ':' +
      document.queryCommandState('bold') + '|' + surface.innerHTML;
  });
  document.getElementById('insert').addEventListener('click', function() {
    out.textContent = 'insert:' + document.execCommand('insertText', false, 'X') + '|' +
      surface.innerHTML;
  });
</script>
