<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:370px;width:55px;height:30px}.action{top:415px;width:90px}</style></head><body><svg id="scene" width="600" height="360"><rect id="primary" x="10" y="5" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" id="A" begin="start.click" dur="2s" repeatCount="2" fill="freeze"/></rect><rect id="syncend" x="10" y="55" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="A.end+0.5s" dur="1s" fill="freeze"/></rect><rect id="syncbegin" x="10" y="105" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="A.begin+1s" dur="1s" fill="freeze"/></rect><rect id="syncrepeat" x="10" y="155" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="A.begin+2s" dur="1s" fill="freeze"/></rect><rect id="manual" x="10" y="205" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" id="E" begin="indefinite" dur="2s" fill="freeze"/></rect><rect id="offset" x="10" y="255" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" id="F" begin="indefinite" dur="2s" fill="freeze"/></rect><rect id="stopped" x="10" y="305" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="0s" end="stop.click" dur="5s" fill="freeze"/></rect></svg><button id="sample0" style="left:10px">0s</button><button id="sample1" style="left:75px">0.5s</button><button id="sample2" style="left:140px">1s</button><button id="sample3" style="left:205px">2s</button><button id="sample4" style="left:270px">2.5s</button><button id="sample5" style="left:335px">4s</button><button id="sample6" style="left:400px">4.5s</button><button id="sample7" style="left:465px">5s</button><button class="action" id="start" style="left:10px">start</button><button class="action" id="manualStart" style="left:120px">manual</button><button class="action" id="stop" style="left:230px">stop</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-values","unsupported");return;}scene.setCurrentTime(t);var names=["primary","syncend","syncbegin","syncrepeat","manual","offset","stopped"],values=[];for(var i=0;i<names.length;i++)values.push(Math.round(document.getElementById(names[i]).getBBox().x));scene.setAttribute("data-values",values.join(","));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(2);};document.getElementById("sample4").onclick=function(){sample(2.5);};document.getElementById("sample5").onclick=function(){sample(4);};document.getElementById("sample6").onclick=function(){sample(4.5);};document.getElementById("sample7").onclick=function(){sample(5);};document.getElementById("manualStart").onclick=function(){var e=document.getElementById("E"),f=document.getElementById("F");if(typeof e.beginElement==="function"){e.beginElement();f.beginElementAt(0.5);scene.setAttribute("data-control","started");}else scene.setAttribute("data-control","unsupported");};document.getElementById("stop").onclick=function(){var e=document.getElementById("E"),f=document.getElementById("F");if(typeof e.endElement==="function"){e.endElement();f.endElementAt(0.25);scene.setAttribute("data-control","ended");}};</script></body></html>
