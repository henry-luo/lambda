<!doctype html><html><head><style>html,body{margin:0}button{position:absolute;width:55px;height:30px;top:335px}</style></head><body><svg id="scene" width="550" height="325"><rect id="self" x="10" y="10" width="20" height="30" fill="red"><animate id="selfAnim" attributeName="x" from="10" to="110" begin="0;selfAnim.end-0.5s" dur="1s"/></rect><rect id="a" x="10" y="55" width="20" height="30" fill="red"><animate id="aAnim" attributeName="x" from="10" to="110" begin="0;bAnim.end-0.5s" dur="1s"/></rect><rect id="b" x="10" y="100" width="20" height="30" fill="red"><animate id="bAnim" attributeName="x" from="10" to="110" begin="aAnim.end-0.5s" dur="1s"/></rect><rect id="future" x="10" y="145" width="20" height="30" fill="red"><animate id="futureAnim" attributeName="x" from="10" to="110" begin="10s" dur="1s"/></rect><rect id="before_begin" x="10" y="190" width="20" height="30" fill="red"><animate id="beforeBeginAnim" attributeName="x" from="10" to="110" begin="futureAnim.begin-9s" dur="1s"/></rect><rect id="before_end" x="10" y="235" width="20" height="30" fill="red"><animate id="beforeEndAnim" attributeName="x" from="10" to="110" begin="futureAnim.end-10s" dur="1s"/></rect><rect id="negative" x="10" y="280" width="20" height="30" fill="red"><animate id="negativeAnim" attributeName="x" from="10" to="110" begin="-1s" dur="2s"/></rect></svg><button id="sample0" style="left:5px">0s</button><button id="sample1" style="left:70px">0.25s</button><button id="sample2" style="left:135px">0.5s</button><button id="sample3" style="left:200px">0.75s</button><button id="sample4" style="left:265px">1s</button><button id="sample5" style="left:330px">1.25s</button><button id="sample6" style="left:395px">1.5s</button><button id="sample7" style="left:460px">2s</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-values","unsupported");return;}scene.setCurrentTime(t);var names=["self", "a", "b", "future", "before_begin", "before_end", "negative"],v=[];for(var i=0;i<names.length;i++){v.push(Math.round(document.getElementById(names[i]).getBBox().x));}scene.setAttribute("data-values",v.join(","));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.25);};document.getElementById("sample2").onclick=function(){sample(0.5);};document.getElementById("sample3").onclick=function(){sample(0.75);};document.getElementById("sample4").onclick=function(){sample(1);};document.getElementById("sample5").onclick=function(){sample(1.25);};document.getElementById("sample6").onclick=function(){sample(1.5);};document.getElementById("sample7").onclick=function(){sample(2);};</script></body></html>
