<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:130px;width:90px;height:30px}</style></head><body><svg id="scene" width="260" height="120"><rect id="moving" x="10" y="10" width="30" height="30" fill="red"><animate id="runner" attributeName="x" from="10" to="110" begin="indefinite" dur="0.2s" repeatCount="3" fill="freeze"/></rect><rect x="10" y="70" width="30" height="30" fill="red"><set attributeName="fill" to="blue" begin="runner.repeat(1)"/></rect></svg><button id="start" style="left:10px">start</button><button id="report" style="left:120px">report</button><script>var scene=document.getElementById("scene"),runner=document.getElementById("runner"),seen=[],repeats=0;if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}runner.addEventListener("beginEvent",function(){seen.push("begin");});runner.addEventListener("repeatEvent",function(e){seen.push("repeat"+(++repeats));});runner.addEventListener("endEvent",function(){seen.push("end");});document.getElementById("start").onclick=function(){if(typeof runner.beginElement==="function"){runner.beginElement();scene.unpauseAnimations();}};document.getElementById("report").onclick=function(){if(typeof scene.pauseAnimations==="function")scene.pauseAnimations();scene.setAttribute("data-events",seen.join(","));scene.setAttribute("data-paused",typeof scene.animationsPaused==="function"?String(scene.animationsPaused()):"unsupported");};</script></body></html>
