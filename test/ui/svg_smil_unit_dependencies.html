<!doctype html><html><head><style>html,body{margin:0}button{position:absolute;top:130px;width:65px;height:30px}</style></head><body><svg id="scene" width="300" height="120">
<g font-size="20"><animate attributeName="font-size" from="20" to="40" begin="0.5s" dur="1s" fill="freeze"/><rect x="10" y="10" width="1em" height="20" fill="red"><animate attributeName="width" from="1em" to="2em" dur="2s" fill="freeze"/></rect><rect x="170" y="10" width="1em" height="20" fill="red"><animate attributeName="width" from="1em" to="80px" dur="2s" fill="freeze"/></rect></g>
<g font-size="20"><animate attributeName="font-size" from="20" to="40" begin="0.5s" dur="1s" fill="freeze"/><path d="M10 60H230" stroke="blue" stroke-width="8" stroke-dasharray="1em 1em"><animate attributeName="stroke-dasharray" from="1em 1em" to="2em 2em" dur="2s" fill="freeze"/></path></g>
<rect x="10" y="90" width="30" height="20" fill="green"><animate attributeName="opacity" from="100%" to="0.5" dur="2s" fill="freeze"/></rect>
</svg><button id="zero" style="left:10px">0</button><button id="one" style="left:90px">1</button><button id="two" style="left:170px">2</button><button id="rewind" style="left:250px">rewind</button>
<script>var scene=document.getElementById("scene");scene.pauseAnimations();scene.setCurrentTime(0);function wire(id,t){document.getElementById(id).onclick=function(){scene.setCurrentTime(t);};}wire("zero",0);wire("one",1);wire("two",2);wire("rewind",0);</script></body></html>
