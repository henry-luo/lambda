<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;background:white}button{height:24px}.stage{display:flex;width:120px;height:20px;font-size:30px;flex-grow:calc(1em / 10px);flex-shrink:calc(1em / 10px)}
.red,.blue{min-width:0;height:20px}.red{font-size:20px;background:red;--weight:calc(1em / 10px);flex-grow:var(--weight);flex-shrink:var(--weight)}
.blue{background:blue;flex-grow:1;flex-shrink:1}#grow>.red,#grow>.blue{flex-basis:0}#shrink>.red,#shrink>.blue{flex-basis:120px}.red.inherit{flex-grow:inherit;flex-shrink:inherit}
</style><button id="check">Check</button><button id="change">Change</button><button id="invalid">Invalid</button><button id="inherit">Inherit</button>
<button id="negative">Negative</button><output id="report"></output><div id="grow" class="stage"><div id="growRed" class="red"></div><div class="blue"></div></div><div id="shrink" class="stage"><div id="shrinkRed" class="red"></div><div class="blue"></div></div>
<script>(function(){var a=document.getElementById('growRed'),b=document.getElementById('shrinkRed'),report=document.getElementById('report');function record(prefix){report.setAttribute('data-'+prefix+'values',getComputedStyle(a).flexGrow+'|'+getComputedStyle(b).flexShrink);}document.getElementById('check').onclick=function(){record('');};document.getElementById('change').onclick=function(){a.style.fontSize='40px';b.style.fontSize='40px';record('dirty-');};document.getElementById('invalid').onclick=function(){a.style.setProperty('--weight','2px');b.style.setProperty('--weight','2px');record('invalid-');};document.getElementById('inherit').onclick=function(){a.className='red inherit';b.className='red inherit';record('inherited-');};document.getElementById('negative').onclick=function(){a.className='red';b.className='red';a.style.setProperty('--weight','calc(-2)');b.style.setProperty('--weight','calc(-2)');record('negative-');};})();</script>
