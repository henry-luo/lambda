<!doctype html><html><head><style>html,body{margin:0}#scene{--left:20px;--extent:100px;--height:40px}#content{position:relative;width:100%;height:100%;background:red}#formula{width:calc(50% + 20px);height:calc(2em + 10px);font-size:20px}svg{position:absolute;left:0;top:0}</style></head><body><svg id="scene" width="360" height="200"><foreignObject id="variable" style="x:var(--left);y:20px;width:var(--extent);height:var(--height)"><div id="content"></div></foreignObject><foreignObject id="formula" x="20" y="90"><div style="width:100%;height:100%;background:blue"></div></foreignObject></svg><button id="change" style="position:absolute;left:10px;top:210px;width:100px;height:30px">change</button><script>function record(){var a=document.getElementById("variable").getBBox(),b=document.getElementById("formula").getBBox();document.getElementById("scene").setAttribute("data-rectangles",[a.x,a.y,a.width,a.height,b.x,b.y,b.width,b.height].join(","));}record();document.getElementById("change").onclick=function(){var s=document.getElementById("scene");s.style.setProperty("--left","60px");s.style.setProperty("--extent","140px");document.getElementById("formula").style.fontSize="30px";record();};</script></body></html>
