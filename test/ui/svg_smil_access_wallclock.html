<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button,input{position:absolute;top:160px;height:30px;width:80px}</style></head><body><svg id="scene" width="420" height="150"><rect id="keyed" x="10" y="10" width="30" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="accessKey(a)+0.5s" end="accessKey(z)" dur="2s" fill="freeze"/></rect><rect id="past" x="10" y="60" width="30" height="30" fill="red"><set attributeName="fill" to="blue" begin="indefinite" dur="120s" fill="freeze"/></rect><rect id="future" x="60" y="60" width="30" height="30" fill="red"><set attributeName="fill" to="blue" begin="wallclock(9999-12-31T23:59:59Z)" dur="1s" fill="freeze"/></rect><rect id="expired" x="110" y="60" width="30" height="30" fill="red"><set attributeName="fill" to="blue" begin="wallclock(2000-01-01T00:00:00Z)" dur="1s" fill="freeze"/></rect></svg><input id="focus" style="left:10px"><button id="half" style="left:110px">half</button><button id="one" style="left:210px">one</button><button id="two" style="left:310px">two</button><script>document.getElementById('past').firstElementChild.setAttribute('begin','wallclock('+new Date(Date.now()-60000).toISOString()+')');var scene=document.getElementById('scene');scene.pauseAnimations();scene.setCurrentTime(0);document.getElementById('half').onclick=function(){scene.setCurrentTime(.5);};document.getElementById('one').onclick=function(){scene.setCurrentTime(1);};document.getElementById('two').onclick=function(){scene.setCurrentTime(2);};</script></body></html>
