<!doctype html>
<style>
html, body { margin: 0; }
body { height: 900px; }
svg { position: absolute; left: 20px; top: 40px; overflow: visible; font-size: 20px; }
button { position: fixed; left: 220px; top: 10px; width: 120px; height: 30px; }
</style>
<svg id="scene" width="160" height="100">
  <path id="overflow" d="M-15 0H-5V20H-15Z" fill="green"/>
  <g id="group" transform="translate(20 20)" fill="red">
    <path id="glyph" d="M0 0H20V20H0Z"/>
    <g transform="translate(50 0)"><rect id="sibling" width="1em" height="20"/></g>
  </g>
</svg>
<button id="change">change</button>
<script>
function hit(x, y) { var e = document.elementFromPoint(x, y); return e ? e.id : "missing"; }
document.getElementById("change").onclick = function() {
  var group = document.getElementById("group");
  var scene = document.getElementById("scene");
  var results = [hit(45, 65), hit(95, 65), hit(10, 45)];
  group.setAttribute("transform", "translate(60 20)");
  results.push(hit(45, 65), hit(85, 65));
  group.style.fill = "blue";
  group.style.pointerEvents = "none";
  results.push(hit(85, 65));
  document.getElementById("glyph").style.pointerEvents = "all";
  results.push(hit(85, 65));
  group.style.pointerEvents = "all";
  scene.style.fontSize = "40px";
  results.push(hit(165, 65));
  scene.setAttribute("data-hits", results.join(","));
};
</script>
