<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:260px;left:10px;width:100px;height:30px}</style></head><body><svg id="scene" width="420" height="240"><defs><g id="prototype"><rect id="leaf" x="10" y="10" width="60" height="50" fill="red"><set attributeName="fill" to="blue" begin="click" dur="1s" fill="freeze"/></rect><rect x="10" y="90" width="60" height="50" fill="red"><set attributeName="fill" to="lime" begin="leaf.click" dur="1s" fill="freeze"/></rect><rect x="10" y="150" width="60" height="40" fill="red"><set attributeName="fill" to="blue" begin="accessKey(k)" dur="1s" fill="freeze"/></rect></g></defs><use id="a" href="#prototype"/><use id="b" href="#prototype" x="200"/></svg><button id="replace">replace</button><script>var scene=document.getElementById('scene');scene.pauseAnimations();scene.setCurrentTime(0);scene.addEventListener('click',function(e){scene.setAttribute('data-target',e.target.id);});document.getElementById('replace').onclick=function(){var a=document.getElementById('a')||document.getElementById('c'),c=a.cloneNode(true);a.remove();c.setAttribute('id',a.id==='a'?'c':'d');scene.appendChild(c);};</script></body></html>
