<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:white}button{height:24px}#stage{position:absolute;left:0;top:72px;width:160px;height:96px;background:lime}#pane{position:absolute;left:8px;top:8px;width:48px;height:32px;overflow:hidden;transform:translate(4px,4px) scale(1.25);transform-origin:0 0}#source{position:absolute;left:-24px;top:-16px;width:120px;height:96px;background:blue}#stripe{position:absolute;left:48px;top:0;width:8px;height:96px;background:red}</style>
<button id=reset>Reset</button><button id=move>Move</button><button id=round>Round</button><button id=flip>Flip</button><button id=scroll>Scroll</button><button id=wide>Width</button>
<div id=stage><div id=pane><div id=source><div id=stripe></div></div></div></div>
<script>(function(){var pane=document.getElementById('pane');document.getElementById('reset').onclick=function(){pane.style.width='48px';pane.style.borderRadius='0';pane.style.transform='translate(4px,4px) scale(1.25)';pane.scrollLeft=0;pane.scrollTop=0};document.getElementById('move').onclick=function(){pane.style.transform='translate(24px,8px) scale(1.5)'};document.getElementById('round').onclick=function(){pane.style.borderRadius='8px'};document.getElementById('flip').onclick=function(){pane.style.transform='translate(80px,8px) scaleX(-1)'};document.getElementById('scroll').onclick=function(){pane.scrollLeft=8;pane.scrollTop=8};document.getElementById('wide').onclick=function(){pane.style.width='72px'};})();</script>
