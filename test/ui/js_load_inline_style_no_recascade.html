<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Load-time inline style mutation</title>
<style>
  #box { width: 41px; height: 20px; color: rgb(255, 0, 0); }
</style>
<script>
  var box = document.getElementById('box');
  box.style.width = '123px';
  box.style.color = 'rgb(0, 128, 0)';
</script>
</head>
<body>
  <div id="box">inline style</div>
</body>
</html>
