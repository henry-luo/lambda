<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:white}button{height:24px}#parent{position:absolute;left:0;top:40px;font-size:4px}#box{width:48px;height:32px;font-size:30px;background-color:blue}</style>
<button id=grammar>Validate radii</button><button id=inherit>Inherit owner</button><button id=resize>Resize owner</button><button id=percent>Percent radii</button><button id=math>Math radii</button><button id=invalid>Invalid variable</button><button id=recover>Recover variable</button><output id=report></output><div id=parent><div id=box></div></div>
<script>(function(){var parent=document.getElementById('parent'),box=document.getElementById('box'),report=document.getElementById('report');var stops='red 0%,red 50%,blue 50%';
document.getElementById('grammar').onclick=function(){var invalid=['circle 50%','ellipse 16px','circle 24px 16px','ellipse 24px 16px 8px','circle circle','ellipse closest-side 24px 16px','24px ellipse 16px','circle -1px','ellipse 50% -1%','circle calc(50%)','circle calc(4em + 1%)','ellipse 24px 16px at right 3px bottom','ellipse 24px 16px at','circle 16px at left right'];var preserved=0;for(var i=0;i<invalid.length;i++){box.style.backgroundImage='radial-gradient(red,red)';var before=box.style.backgroundImage;box.style.backgroundImage='radial-gradient('+invalid[i]+',red,blue)';if(box.style.backgroundImage===before)preserved++}report.setAttribute('data-preserved',''+preserved)};
document.getElementById('inherit').onclick=function(){parent.style.fontSize='4px';parent.style.backgroundImage='radial-gradient(ellipse 6em 4em at center,'+stops+')';box.style.backgroundImage='inherit';box.style.width='48px'};
document.getElementById('resize').onclick=function(){parent.style.fontSize='8px'};
document.getElementById('percent').onclick=function(){box.style.width='96px';box.style.backgroundImage='radial-gradient(ellipse 50% 50% at center,'+stops+')'};
document.getElementById('math').onclick=function(){box.style.width='48px';box.style.backgroundImage='radial-gradient(ellipse min(50%,50%) max(50%,50%) at center,'+stops+')'};
document.getElementById('invalid').onclick=function(){box.style.fontSize='4px';box.style.setProperty('--radius','50%');box.style.backgroundImage='radial-gradient(circle var(--radius) at center,'+stops+')'};
document.getElementById('recover').onclick=function(){box.style.setProperty('--radius','4em')};
})();</script>
