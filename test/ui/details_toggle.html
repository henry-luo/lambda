<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>details/summary toggle</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 12px; }
  .log { color: #444; }
</style>
</head>
<body>
  <details class="d">
    <summary class="s">Disclosure</summary>
    <p class="body">Hidden until opened.</p>
    <!-- Not a direct child of the details: HTML gives it no activation
         behavior, so clicking it must not toggle the outer details. -->
    <div class="wrap"><summary class="nested">Nested, inert</summary></div>
  </details>

  <p class="log" id="log">toggles:0</p>

  <script>
    // Proves the package fired `toggle` on the <details>, not the <summary>.
    var count = 0;
    document.querySelector('.d').addEventListener('toggle', function () {
      count = count + 1;
      document.getElementById('log').textContent = 'toggles:' + count;
    });
  </script>
</body>
</html>
