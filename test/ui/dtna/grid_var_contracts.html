<!doctype html>
<style>
body{margin:0}
.grid{display:grid;width:360px;grid-template-columns:repeat(3,minmax(0,1fr))}
.grid>div{height:20px;min-width:0}
#literal{grid-column:span 2}
#variable{--placement:span 2;grid-column:var(--placement)}
#longhand{--placement:span 2;grid-column-end:var(--placement)}
#responsive{--placement:span 1;grid-column:var(--placement)}
@media(min-width:700px){#responsive{--placement:span 2}}
</style>
<div class="grid"><div id="literal"></div></div>
<div class="grid"><div id="variable"></div></div>
<div class="grid"><div id="longhand"></div></div>
<div class="grid"><div id="responsive"></div></div>
