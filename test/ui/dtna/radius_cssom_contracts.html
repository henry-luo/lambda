<!doctype html>
<html><head><style>
.probe{display:block;width:100px;height:40px;margin:8px;background:blue}
#percent{border-radius:50%}
#overlap{border-radius:80px}
#elliptic{border-radius:10px 20px 30px 40px / 50% 60% 70% 80%}
#math{border-radius:calc(10px + 20%)}
#font{font-size:10px;border-radius:2em}
#logical{direction:rtl;border-start-start-radius:11px 22px}
</style></head><body>
<div id="percent" class="probe"></div><div id="overlap" class="probe"></div>
<div id="elliptic" class="probe"></div><div id="math" class="probe"></div>
<div id="font" class="probe"></div><div id="logical" class="probe"></div>
</body></html>
