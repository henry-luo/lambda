<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:'Liberation Sans';src:url('../../layout/data/font/LiberationSans-Regular.ttf')}
body{margin:0;padding:24px;font:14px/22px 'Liberation Sans'}
.scope{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.box{display:inline-block;border:1px solid black;padding:0 7px}
.small{font-size:12px;line-height:20px}.large{font-size:20px;line-height:28px}
.icon{display:inline-flex;line-height:0;vertical-align:-0.125em}
.icon svg{width:1em;height:1em}
</style></head><body><div class="scope">
<span class="box small" id="strut-small-first"><span class="icon"><svg viewBox="0 0 12 12"><rect width="12" height="12" fill="blue"/></svg></span><span>Small first</span></span>
<span class="box large" id="strut-large"><span>Large</span><span class="icon"><svg viewBox="0 0 12 12"><rect width="12" height="12" fill="blue"/></svg></span></span>
<span class="box small" id="strut-small-last"><span>Small last</span><span class="icon"><svg viewBox="0 0 12 12"><rect width="12" height="12" fill="blue"/></svg></span></span>
<span class="box" id="strut-inherited"><span class="icon"><svg viewBox="0 0 12 12"><rect width="12" height="12" fill="blue"/></svg></span><span>Inherited</span></span>
</div></body></html>
