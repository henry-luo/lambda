<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DOM mutation replaceChild notifies</title>
</head>
<body>
  <label for="trigger">Trigger</label>
  <input id="trigger" value="ready">
  <div id="container">
    <span id="old-child">old child</span>
  </div>
  <p id="status" data-state="waiting">waiting</p>
  <script>
    const trigger = document.getElementById('trigger');
    const container = document.getElementById('container');
    const status = document.getElementById('status');
    let replaced = false;
    let oldChild = null;
    let newChild = null;

    const observer = new MutationObserver((records) => {
      const record = records[0];
      status.setAttribute('data-mutation', [
        record.type,
        String(record.addedNodes.length),
        String(record.removedNodes.length),
        String(record.addedNodes[0] === newChild),
        String(record.removedNodes[0] === oldChild)
      ].join(':'));
    });
    observer.observe(container, { childList: true });

    trigger.addEventListener('keydown', () => {
      if (replaced) return;
      replaced = true;
      oldChild = document.getElementById('old-child');
      newChild = document.createElement('span');
      newChild.id = 'new-child';
      newChild.setAttribute('data-label', 'replacement child');
      container.replaceChild(newChild, oldChild);
      status.setAttribute('data-state', 'replaceChild complete');
    });
  </script>
</body>
</html>
