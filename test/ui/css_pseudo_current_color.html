<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0}button{height:24px}
#owner{color:red;border-top-color:currentColor}
#owner::before,#owner::after{content:"";display:block;width:80px;height:20px;border:4px solid}
#owner::before{color:var(--before-color,blue);background-color:currentColor;border-top-color:currentColor}
#owner::after{color:var(--after-color,green);border-top-color:inherit}
#patch{width:80px;height:12px;border-top:4px solid}
</style>
<button id="check">Check</button><button id="change">Change colors</button><button id="literal">Inherit literal</button>
<output id="report"></output><div id="owner"></div><div id="patch"></div>
<script>
(function(){
    var owner=document.getElementById('owner'),report=document.getElementById('report');
    function record(prefix){
        var before=getComputedStyle(owner,'::before'),after=getComputedStyle(owner,'::after');
        report.setAttribute('data-'+prefix+'before',[before.color,before.backgroundColor,before.borderTopColor,before.borderRightColor].join('|'));
        report.setAttribute('data-'+prefix+'after',[after.color,after.borderTopColor,after.borderRightColor].join('|'));
        var patch=document.getElementById('patch');patch.style.backgroundColor=before.backgroundColor;patch.style.borderTopColor=after.borderTopColor;
    }
    document.getElementById('check').onclick=function(){record('');};
    document.getElementById('change').onclick=function(){
        owner.style.color='black';owner.style.setProperty('--before-color','purple');owner.style.setProperty('--after-color','blue');record('dirty-');
    };
    document.getElementById('literal').onclick=function(){owner.style.borderTopColor='red';record('literal-');};
})();
</script>
