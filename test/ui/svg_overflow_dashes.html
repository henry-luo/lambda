<!DOCTYPE html>
<html><head><style>
html, body { margin:0; background:white; }
svg { position:absolute; }
</style></head><body>
<svg id="visible-root" width="40" height="40" style="left:20px;top:20px;overflow:visible"><rect id="root-overhang" x="30" y="10" width="30" height="20" fill="red"/></svg>
<svg width="40" height="40" style="left:120px;top:20px;overflow:hidden"><rect x="30" y="10" width="30" height="20" fill="blue"/></svg>
<svg width="300" height="80" style="left:200px;top:0">
  <svg x="10" y="20" width="40" height="40"><rect x="30" y="10" width="30" height="20" fill="lime"/></svg>
  <svg x="90" y="20" width="40" height="40" overflow="visible"><rect id="nested-overhang" x="30" y="10" width="30" height="20" fill="magenta"/></svg>
  <svg x="180" y="20" width="40" height="40" overflow="hidden" transform="translate(20,0)"><rect x="30" y="10" width="30" height="20" fill="cyan"/></svg>
</svg>
<svg width="200" height="100" style="left:0;top:100px">
  <line id="zero-dash" x1="10" y1="20" x2="90" y2="20" stroke="red" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 20"/>
  <line x1="10" y1="45" x2="90" y2="45" stroke="blue" stroke-width="8" stroke-dasharray="0 0"/>
  <line x1="10" y1="70" x2="90" y2="70" stroke="lime" stroke-width="8" stroke-dasharray="10 -10"/>
</svg>
<svg width="200" height="100" style="left:220px;top:100px" viewBox="0 0 200 100">
  <line id="percent-stroke" x1="10" y1="20" x2="110" y2="20" stroke="magenta" stroke-width="10%"/>
  <line x1="10" y1="60" x2="150" y2="60" stroke="cyan" stroke-width="8" stroke-dasharray="10% 10%" stroke-dashoffset="10%"/>
</svg>
<svg width="40" height="40" style="left:450px;top:110px;overflow:visible"><g fill="blue" opacity="0.5"><rect x="20" y="10" width="30" height="20"/><rect x="30" y="10" width="30" height="20"/></g></svg>
</body></html>
