<!doctype html><html><head><style>html,body{margin:0;background:white}svg{display:block}</style></head><body><svg width="800" height="200"><defs>
<linearGradient id="gradient"><stop stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
<pattern id="pattern" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="10" height="20" fill="red"/><rect x="10" width="10" height="20" fill="blue"/></pattern>
<filter id="f-fill" filterUnits="userSpaceOnUse" x="10" y="20" width="120" height="80" color-interpolation-filters="sRGB"><feOffset in="FillPaint"/></filter>
<filter id="f-stroke" filterUnits="userSpaceOnUse" x="170" y="20" width="120" height="80" color-interpolation-filters="sRGB"><feOffset in="StrokePaint"/></filter>
<filter id="f-gradient" filterUnits="userSpaceOnUse" x="330" y="20" width="120" height="80" color-interpolation-filters="sRGB"><feOffset in="FillPaint"/></filter>
<filter id="f-pattern" filterUnits="userSpaceOnUse" x="490" y="20" width="120" height="80" color-interpolation-filters="sRGB"><feOffset in="StrokePaint"/></filter>
<filter id="f-current" filterUnits="userSpaceOnUse" x="650" y="20" width="120" height="80" color-interpolation-filters="sRGB"><feOffset in="FillPaint"/></filter>
</defs>
<rect x="30" y="30" width="80" height="40" fill="red" fill-opacity=".25" filter="url(#f-fill)"/>
<rect x="190" y="30" width="80" height="40" fill="none" stroke="blue" stroke-opacity=".25" filter="url(#f-stroke)"/>
<rect x="350" y="30" width="80" height="40" fill="url(#gradient)" filter="url(#f-gradient)"/>
<rect x="510" y="30" width="80" height="40" fill="none" stroke="url(#pattern)" filter="url(#f-pattern)"/>
<rect x="670" y="30" width="80" height="40" color="#00ff00" fill="currentColor" filter="url(#f-current)"/>
</svg></body></html>
