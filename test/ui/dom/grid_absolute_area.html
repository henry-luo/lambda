<!doctype html>
<meta charset="utf-8">
<title>Absolute grid areas constrain their contents</title>
<style>
body { margin: 0; }
#outer { position: relative; width: 600px; height: 400px; }
#grid {
    display: grid; position: relative; width: 300px; height: 200px;
    padding: 10px 20px; border: 2px solid black;
    grid-template-columns: 100px 200px; grid-template-rows: 80px 120px;
    grid-template-areas: "copy photo" "copy photo";
}
#subject { position: absolute; inset: 0; grid-area: photo; background: red; }
#inner { width: 100%; height: 100%; background: lime; }
</style>
<div id="outer"><div id="grid"><div id="subject"><div id="inner"></div></div></div></div>
<button id="grow">Grow tracks</button><button id="swap">Move named area</button><button id="size">Use explicit size</button>
<script>
const grid = document.getElementById('grid');
document.getElementById('grow').addEventListener('click', function () {
    grid.style.width = '400px';
    grid.style.gridTemplateColumns = '150px 250px';
});
document.getElementById('swap').addEventListener('click', function () {
    grid.style.gridTemplateAreas = '"photo copy" "photo copy"';
    grid.style.gridTemplateColumns = '250px 150px';
});
document.getElementById('size').addEventListener('click', function () {
    const subject = document.getElementById('subject');
    subject.style.width = '80px';
    subject.style.height = '50px';
});
</script>
