<!doctype html>
<meta charset="utf-8">
<title>Grid percentage area after resize, font and variable changes</title>
<style>
body { margin: 0; }
.grid { display: grid; width: var(--grid-width, 1160px); grid-template-columns: 1fr 1fr; gap: 64px; }
#column { --fill: 100%; font-size: 20px; width: calc(var(--fill) - 1em); display: flex;
    flex-direction: column; align-items: flex-start; background: red; }
.copy { width: 160px; height: 80px; }
.picture { width: 560px; height: 80px; margin-right: -180px; background: blue; }
</style>
<div class="grid"><div id="column"><div class="copy"></div></div><div><div class="picture"></div></div></div>
<button id="resize">Resize</button><button id="font">Change font</button><button id="fill">Change percentage</button>
<script>
document.getElementById('resize').addEventListener('click', function () {
    document.documentElement.style.setProperty('--grid-width', '1080px');
});
document.getElementById('font').addEventListener('click', function () {
    document.getElementById('column').style.fontSize = '40px';
});
document.getElementById('fill').addEventListener('click', function () {
    document.getElementById('column').style.setProperty('--fill', '50%');
});
</script>
