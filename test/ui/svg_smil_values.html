<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:420px;width:55px;height:30px}</style></head><body><svg id="scene" width="480" height="410"><rect id="key" x="10" y="5" width="20" height="30" fill="red"><animate attributeName="x" values="10;30;110" keyTimes="0;0.25;1" dur="2s" fill="freeze"/></rect><rect id="discrete" x="10" y="55" width="20" height="30" fill="red"><animate attributeName="x" values="10;50;110" calcMode="discrete" dur="2s" fill="freeze"/></rect><rect id="paced" x="10" y="105" width="20" height="30" fill="red"><animate attributeName="x" values="10;30;110" calcMode="paced" keyTimes="0;0.9;1" dur="2s" fill="freeze"/></rect><rect id="spline" x="10" y="155" width="20" height="30" fill="red"><animate attributeName="x" values="10;110" keyTimes="0;1" calcMode="spline" keySplines="0.5 0 0.5 1" dur="2s" fill="freeze"/></rect><rect id="fromby" x="10" y="205" width="20" height="30" fill="red"><animate attributeName="x" from="10" by="100" dur="2s" fill="freeze"/></rect><rect id="to" x="10" y="255" width="20" height="30" fill="red"><animate attributeName="x" to="110" dur="2s" fill="freeze"/></rect><rect id="add" x="10" y="305" width="20" height="30" fill="red"><animate attributeName="x" from="0" to="100" additive="sum" dur="2s" fill="freeze"/></rect><rect id="acc" x="10" y="355" width="20" height="30" fill="red"><animate attributeName="x" from="10" to="30" repeatCount="3" accumulate="sum" dur="2s" fill="freeze"/></rect></svg><button id="sample0" style="left:10px">0s</button><button id="sample1" style="left:75px">0.5s</button><button id="sample2" style="left:140px">1s</button><button id="sample3" style="left:205px">1.5s</button><button id="sample4" style="left:270px">2s</button><button id="sample5" style="left:335px">2.5s</button><button id="sample6" style="left:400px">6s</button><script>var scene=document.getElementById("scene");if(typeof scene.pauseAnimations==="function"){scene.pauseAnimations();scene.setCurrentTime(0);}function sample(t){if(typeof scene.setCurrentTime!=="function"){scene.setAttribute("data-values","unsupported");return;}scene.setCurrentTime(t);var names=["key","discrete","paced","spline","fromby","to","add","acc"], values=[];for(var i=0;i<names.length;i++){values.push(Math.round(document.getElementById(names[i]).getBBox().x));}scene.setAttribute("data-values",values.join(","));}document.getElementById("sample0").onclick=function(){sample(0);};document.getElementById("sample1").onclick=function(){sample(0.5);};document.getElementById("sample2").onclick=function(){sample(1);};document.getElementById("sample3").onclick=function(){sample(1.5);};document.getElementById("sample4").onclick=function(){sample(2);};document.getElementById("sample5").onclick=function(){sample(2.5);};document.getElementById("sample6").onclick=function(){sample(6);};</script></body></html>
