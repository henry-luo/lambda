<!doctype html>
<meta charset="utf-8">
<title>Finder HTML preview</title>
<style>
html, body { margin: 0; font: 14px/1.5 Helvetica, sans-serif; color: #303741; background: white; }
main { padding: 16px; }
h1 { font-size: 22px; }
#color-sample { height: 60px; background: #2d8b57; color: white; padding: 12px; }
#scroll-sample { height: 900px; background: #f1f5f9; }
</style>
<main>
  <h1>Rendered HTML</h1>
  <div id="color-sample">A real document preview</div>
  <p><strong id="formatted">Formatting stays intact.</strong></p>
  <div id="scroll-sample">Scroll inside this document.</div>
</main>
