<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="300" fill="#fbf8f2"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#1f1f1f">Midday surface temperature, °C</text>
