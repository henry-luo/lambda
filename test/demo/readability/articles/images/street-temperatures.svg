  <g stroke="#e3ddd0" stroke-width="1">
    <line x1="150" y1="78" x2="150" y2="262"/>
    <line x1="290" y1="78" x2="290" y2="262"/>
    <line x1="430" y1="78" x2="430" y2="262"/>
    <line x1="570" y1="78" x2="570" y2="262"/>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="150" y="282">0</text><text x="290" y="282">20</text><text x="430" y="282">40</text><text x="570" y="282">60</text>
  </g>
  <g font-size="13" fill="#1f1f1f" text-anchor="end">
