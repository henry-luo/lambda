<!doctype html><html><head><style>body{margin:0;padding:12px;font:14px sans-serif;background:#eef2f7}scene3d{display:block;width:220px;height:140px}.panel{position:relative;width:170px;padding:6px 10px;background:rgba(255,255,255,.72);border-radius:8px}#b{margin-left:30.25px}.over{margin:-46px 0 0 24px}</style></head><body><p>Two scenes interleaved with text and translucent panels.</p><scene3d id="a" camera="cam-a" background="#203040"><camera id="cam-a" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-a" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#e07020"></material></mesh><animation-clip id="drift-a" duration="6" autoplay="true"><keyframe-track path="cube-a.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d><div class="panel over">Panel over the first scene</div><p>Between the scenes.</p><scene3d id="b" camera="cam-b" background="#402030"><camera id="cam-b" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-b" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#30a0e0"></material></mesh><animation-clip id="drift-b" duration="6" autoplay="true"><keyframe-track path="cube-b.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d><div class="panel over">Panel over the second</div><p>Below both scenes.</p></body></html>
