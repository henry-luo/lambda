<!doctype html><html><head><style>body{margin:0;padding:12px;font:14px sans-serif;background:#eef2f7}scene3d{display:block;width:220px;height:140px}#r{margin-left:20.25px}.stripes{background:repeating-linear-gradient(45deg,#c8d4e4 0 10px,#eef2f7 10px 20px)}</style></head><body><p>Capped densities: one, one half, and one half without a background, over stripes.</p><scene3d id="p" camera="cam-p" background="#203040" max-pixel-ratio="1"><camera id="cam-p" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-p" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#e07020"></material></mesh><animation-clip id="drift-p" duration="6" autoplay="true"><keyframe-track path="cube-p.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d><p>Between.</p><scene3d id="q" camera="cam-q" background="#402030" max-pixel-ratio="0.5"><camera id="cam-q" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-q" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#30a0e0"></material></mesh><animation-clip id="drift-q" duration="6" autoplay="true"><keyframe-track path="cube-q.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d><div class="stripes"><scene3d id="r" camera="cam-r" max-pixel-ratio="0.5"><camera id="cam-r" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-r" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#40c060"></material></mesh><animation-clip id="drift-r" duration="6" autoplay="true"><keyframe-track path="cube-r.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></div></body></html>
