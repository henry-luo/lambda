<!doctype html><html><head><style>
body{margin:0;padding:12px;font:14px sans-serif;background:#eef2f7}
canvas{display:block;margin:6px 0}
#px{width:128px;height:96px;image-rendering:pixelated}
#a{width:240px;height:150px}
#b{width:200px;height:120px;position:relative;left:10.5px}
.round{border-radius:20px;overflow:hidden;width:200px}
#c{width:200px;height:120px;margin:0}
#d{width:160px;height:120px;transform:rotate(8deg);margin:16px 24px}
.panel{position:relative;width:170px;margin-top:-40px;padding:6px 10px;background:rgba(255,255,255,.72);border-radius:8px}
</style></head><body>
<canvas id="px" width="32" height="24"></canvas>
<p>A pixelated canvas stays on the CPU; the next four composite.</p>
<canvas id="a" width="160" height="100"></canvas>
<div class="panel">Premultiplied, magnified, under a translucent panel</div>
<canvas id="b" width="200" height="120"></canvas>
<p>Straight alpha at a fractional offset</p>
<div class="round"><canvas id="c" width="200" height="120"></canvas></div>
<p>Opaque, in a rounded box</p>
<canvas id="d" width="160" height="120"></canvas>
<p>Preserved drawing buffer, rotated</p>
<script>
const vertex = `#version 300 es
in vec2 p; uniform float angle; uniform vec2 offset;
void main() { float c = cos(angle), s = sin(angle); gl_Position = vec4(c * p.x - s * p.y + offset.x, s * p.x + c * p.y + offset.y, 0.0, 1.0); }`;
const fragment = `#version 300 es
precision mediump float; uniform vec4 color; out vec4 o;
void main() { o = color; }`;
function setup(id, options, clear, color) {
  const gl = document.getElementById(id).getContext('webgl2', options);
  const program = gl.createProgram();
  for (const [type, source] of [[gl.VERTEX_SHADER, vertex], [gl.FRAGMENT_SHADER, fragment]]) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source); gl.compileShader(shader); gl.attachShader(program, shader);
  }
  gl.linkProgram(program); gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0.7, -0.6, -0.5, 0.6, -0.5]), gl.STATIC_DRAW);
  const at = gl.getAttribLocation(program, 'p');
  gl.enableVertexAttribArray(at); gl.vertexAttribPointer(at, 2, gl.FLOAT, false, 0, 0);
  gl.enable(gl.BLEND);
  gl.blendFunc(options.premultipliedAlpha === false ? gl.SRC_ALPHA : gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  return {gl, clear, color, angle: gl.getUniformLocation(program, 'angle'),
          offset: gl.getUniformLocation(program, 'offset'), tint: gl.getUniformLocation(program, 'color')};
}
// premultiplied buffers take premultiplied colors; straight ones take them as authored
const views = [
  setup('px', {}, [0.1, 0.1, 0.2, 1], [0.9, 0.8, 0.2, 1]),
  setup('a', {}, [0, 0, 0, 0], [0.45, 0.12, 0.06, 0.6]),
  setup('b', {premultipliedAlpha: false}, [0.2, 0.4, 0.8, 0.5], [1, 0.5, 0, 0.75]),
  setup('c', {alpha: false}, [0.12, 0.18, 0.25, 1], [0.3, 0.8, 0.5, 1]),
  setup('d', {preserveDrawingBuffer: true}, null, [0.08, 0.2, 0.36, 0.4]),
];
// the preserved buffer starts cleared once, then accumulates
views[4].gl.clearColor(0.95, 0.95, 0.9, 1); views[4].gl.clear(views[4].gl.COLOR_BUFFER_BIT);
function frame(time) {
  const t = time / 1000;
  for (const v of views) {
    const gl = v.gl;
    if (v.clear) { gl.clearColor(...v.clear); gl.clear(gl.COLOR_BUFFER_BIT); }
    gl.uniform1f(v.angle, t * 1.7);
    gl.uniform2f(v.offset, v.clear ? 0.25 * Math.sin(t * 2.3) : 0.5 * Math.cos(t * 3.1), v.clear ? 0 : 0.4 * Math.sin(t * 3.1));
    gl.uniform4f(v.tint, ...v.color);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
