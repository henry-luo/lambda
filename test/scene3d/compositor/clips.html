<!doctype html><html><head><style>body{margin:0;padding:12px;font:14px sans-serif;background:#eef2f7}scene3d{display:block;width:220px;height:140px}.panel{position:relative;width:170px;padding:6px 10px;background:rgba(255,255,255,.72);border-radius:8px}.round{border-radius:18px;overflow:hidden;width:220px}.narrow{overflow:hidden;width:150.25px}.cut{overflow:hidden;width:150px;height:100px}#l{clip-path:circle(45%)}.outer{border-radius:30px;overflow:hidden;width:200px}.inner{border-radius:8px 40px;overflow:hidden;margin:10px}</style></head><body><div class="round"><scene3d id="i" camera="cam-i" background="#203040"><camera id="cam-i" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-i" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#e07020"></material></mesh><animation-clip id="drift-i" duration="6" autoplay="true"><keyframe-track path="cube-i.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></div><div class="narrow"><scene3d id="j" camera="cam-j" background="#402030"><camera id="cam-j" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-j" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#30a0e0"></material></mesh><animation-clip id="drift-j" duration="6" autoplay="true"><keyframe-track path="cube-j.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></div><div class="cut"><scene3d id="k" camera="cam-k" background="#303030"><camera id="cam-k" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-k" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#40c060"></material></mesh><animation-clip id="drift-k" duration="6" autoplay="true"><keyframe-track path="cube-k.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></div><scene3d id="l" camera="cam-l" background="#303030"><camera id="cam-l" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-l" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#c0a040"></material></mesh><animation-clip id="drift-l" duration="6" autoplay="true"><keyframe-track path="cube-l.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d><div class="outer"><div class="inner"><scene3d id="n" camera="cam-n" background="#303030"><camera id="cam-n" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-n" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#a050c0"></material></mesh><animation-clip id="drift-n" duration="6" autoplay="true"><keyframe-track path="cube-n.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></div></div></body></html>
