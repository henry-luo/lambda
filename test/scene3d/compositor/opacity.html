<!doctype html><html><head><style>body{margin:0;padding:12px;font:14px sans-serif;background:#eef2f7}scene3d{display:block;width:220px;height:140px}.panel{position:relative;width:170px;padding:6px 10px;background:rgba(255,255,255,.72);border-radius:8px}.fade{opacity:.6}.group{opacity:.7;border:2px solid #456}#d{opacity:.5}</style></head><body><div class="fade"><scene3d id="c" camera="cam-c" background="#203040"><camera id="cam-c" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-c" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#e07020"></material></mesh><animation-clip id="drift-c" duration="6" autoplay="true"><keyframe-track path="cube-c.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></div><scene3d id="d" camera="cam-d" background="#402030"><camera id="cam-d" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-d" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#30a0e0"></material></mesh><animation-clip id="drift-d" duration="6" autoplay="true"><keyframe-track path="cube-d.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d><div class="group"><p>The group also holds this text, so its scene stays on the CPU.</p><scene3d id="e" camera="cam-e" background="#303030"><camera id="cam-e" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-e" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#40c060"></material></mesh><animation-clip id="drift-e" duration="6" autoplay="true"><keyframe-track path="cube-e.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></div></body></html>
