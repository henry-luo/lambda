<!doctype html><html><head><style>body{margin:0;padding:12px;font:14px sans-serif;background:#eef2f7}scene3d{display:block;width:220px;height:140px}.panel{position:relative;width:170px;padding:6px 10px;background:rgba(255,255,255,.72);border-radius:8px}.turn{transform:rotate(6deg);margin:24px 0 0 30px;width:220px}#g{transform:translate(10.3px,4.7px) scale(1.25);transform-origin:0 0;margin-top:30px}#h{transform:scale(.6);transform-origin:0 0;margin-top:60px}</style></head><body><div class="turn"><scene3d id="f" camera="cam-f" background="#203040"><camera id="cam-f" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-f" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#e07020"></material></mesh><animation-clip id="drift-f" duration="6" autoplay="true"><keyframe-track path="cube-f.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></div><scene3d id="g" camera="cam-g" background="#402030"><camera id="cam-g" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-g" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#30a0e0"></material></mesh><animation-clip id="drift-g" duration="6" autoplay="true"><keyframe-track path="cube-g.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d><div class="panel">A panel between the scaled scenes</div><scene3d id="h" camera="cam-h" background="#303030"><camera id="cam-h" type="perspective" position="0 0 4" target="0 0 0" fov="60"></camera><light type="ambient" intensity="0.4"></light><light type="directional" position="1 2 4" intensity="0.8"></light><mesh id="cube-h" rotation="0.4 0.6 0"><geometry type="box" size="1.4 1.4 1.4"></geometry><material type="lambert" color="#40c060"></material></mesh><animation-clip id="drift-h" duration="6" autoplay="true"><keyframe-track path="cube-h.position" times="0 3 6" values="-1 0 0 1 0 0 -1 0 0"></keyframe-track></animation-clip></scene3d></body></html>
