<!doctype html><html><head><style>html,body{margin:0}.pair{width:640px}.flex{display:flex}.grid{display:grid;grid-template-columns:160px 160px}</style></head><body>
<div class="pair ratio"><svg id="svg-ratio" viewBox="0 0 640 360" style="width:320px;height:auto"></svg><scene3d id="scene-ratio" viewBox="0 0 640 360" style="width:320px;height:auto"></scene3d></div>
<div class="pair attributes"><svg id="svg-attributes" width="640" height="360" style="width:320px;height:auto"></svg><scene3d id="scene-attributes" width="640" height="360" style="width:320px;height:auto"></scene3d></div>
<div class="pair percent"><svg id="svg-percent" viewBox="0 0 640 360" style="width:50%;height:auto"></svg><scene3d id="scene-percent" viewBox="0 0 640 360" style="width:50%;height:auto"></scene3d></div>
<div class="pair limits"><svg id="svg-limits" viewBox="0 0 640 360" style="width:400px;height:auto;max-width:320px;min-height:100px"></svg><scene3d id="scene-limits" viewBox="0 0 640 360" style="width:400px;height:auto;max-width:320px;min-height:100px"></scene3d></div>
<div class="pair absent"><svg id="svg-absent"  style="width:140px;height:90px"></svg><scene3d id="scene-absent"  style="width:140px;height:90px"></scene3d></div>
<div class="pair invalid"><svg id="svg-invalid" viewBox="0 0 -1 1" style="width:140px;height:90px"></svg><scene3d id="scene-invalid" viewBox="0 0 -1 1" style="width:140px;height:90px"></scene3d></div>
<div class="pair zero"><svg id="svg-zero" viewBox="0 0 0 100" style="width:140px;height:90px"></svg><scene3d id="scene-zero" viewBox="0 0 0 100" style="width:140px;height:90px"></scene3d></div>
<div class="pair only"><svg id="svg-only" viewBox="0 0 640 360" style=""></svg><scene3d id="scene-only" viewBox="0 0 640 360" style=""></scene3d></div>
<div class="pair auto"><svg id="svg-auto"  style=""></svg><scene3d id="scene-auto"  style=""></scene3d></div>
<div class="pair flex"><svg id="svg-flex" viewBox="0 0 640 360" style="width:160px;height:auto;flex:none"></svg><scene3d id="scene-flex" viewBox="0 0 640 360" style="width:160px;height:auto;flex:none"></scene3d></div>
<div class="pair grid"><svg id="svg-grid" viewBox="0 0 640 360" style="width:100%;height:auto"></svg><scene3d id="scene-grid" viewBox="0 0 640 360" style="width:100%;height:auto"></scene3d></div>
</body></html>
