<!doctype html>
<html><head><style>body{margin:0}scene3d{display:block;width:160px;height:120px}</style></head><body>
<scene3d id="world" camera="main" background="#202936">
  <physics gravity="0 0 0" timestep=".01" state="paused"></physics>
  <camera id="main" type="perspective" position="0 3 7" target="0 1 0" fov="70"></camera>
  <rigid-body id="ground" type="fixed"><collider id="ground-shape" shape="mesh" vertices="-10 0 -10 10 0 -10 -10 0 10 10 0 10" indices="0 2 1 1 2 3"></collider></rigid-body>
  <rigid-body id="grid" type="fixed" position="4 0 0"><collider id="grid-shape" shape="heightfield" rows="2" columns="2" heights="0 0 0 0" cell-size="2 2"></collider></rigid-body>
  <rigid-body id="ball" type="dynamic" position="0 3 0" linear-velocity="1 0 0">
    <collider id="ball-shape" shape="sphere" radius=".5"></collider>
    <mesh><geometry type="box"></geometry><material type="basic" color="#ff9933"></material></mesh>
  </rigid-body>
</scene3d>
<script type="module">
import {snapshot, step, query} from '../../lmd/package/physics/scene.ls';
import {capabilities} from '../../lmd/package/scene3d/runtime.ls';
const world=document.getElementById('world');
const actions={read:()=>snapshot(world),step:()=>step(world,10),capabilities:()=>capabilities(world),
  query:()=>query(world,[{type:'distance',collider_a:'ground-shape',collider_b:'ball-shape'},
    {type:'ray',origin:[5.5,4,1.5],direction:[0,-1,0],distance:10}])};
globalThis.surfaceRequest=async operation=>{globalThis.surfaceState=null;globalThis.surfaceState=await actions[operation]();};
globalThis.surfaceBall=()=>surfaceState.bodies.find(body=>body.id==='ball');
</script></body></html>
