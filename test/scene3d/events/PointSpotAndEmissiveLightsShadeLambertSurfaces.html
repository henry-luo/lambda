<!doctype html><html><head><style>body{margin:0}scene3d{display:block;width:128px;height:128px}</style></head><body>
<scene3d id="point" camera="c1"><camera id="c1" type="perspective" position="0 0 4" target="0 0 0" fov="90"></camera><mesh><geometry type="plane" size="8 8 1"></geometry><material type="lambert" color="#808080"></material></mesh><light type="point" position="0 0 1" intensity="1"></light></scene3d>
<scene3d id="cutoff" camera="c2"><camera id="c2" type="perspective" position="0 0 4" target="0 0 0" fov="90"></camera><mesh><geometry type="plane" size="8 8 1"></geometry><material type="lambert" color="#808080"></material></mesh><light type="point" position="0 0 1" intensity="1" distance="1.2"></light></scene3d>
<scene3d id="spot" camera="c3"><camera id="c3" type="perspective" position="0 0 4" target="0 0 0" fov="90"></camera><mesh><geometry type="plane" size="8 8 1"></geometry><material type="lambert" color="#808080"></material></mesh><light type="spot" position="0 0 2" target="0 0 0" intensity="4" angle="0.3"></light></scene3d>
<scene3d id="emissive" camera="c4"><camera id="c4" type="perspective" position="0 0 4" target="0 0 0" fov="90"></camera><mesh position="-1 0 0"><geometry type="plane" size="2 2 1"></geometry><material type="lambert" color="#808080" emissive="#ff0000"></material></mesh><mesh position="1 0 0"><geometry type="plane" size="2 2 1"></geometry><material type="basic" color="#000000" emissive="#ffffff" emissive-intensity="0.5"></material></mesh></scene3d>
</body></html>
