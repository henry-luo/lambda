<!doctype html><html><head><style>body{margin:0}scene3d{display:block;width:128px;height:128px}</style></head><body><scene3d id="scene" camera="main" ><camera id="main" type="perspective" position="0 0 4" target="0 0 0" fov="90"></camera><mesh id="object" rotation="0 0.5 0" scale="2 1 0.5"><geometry id="object-geometry" type="plane" size="2 2 2" ></geometry><material id="object-material" type="lambert" color="#808080" ></material></mesh><light type="ambient" intensity="0.25"></light><light type="directional" position="0 0 4" intensity="0.5"></light></scene3d><script>globalThis.scene=document.getElementById('scene');globalThis.make=(tag,parent,attrs)=>{const n=document.createElement(tag);for(const key in attrs)n.setAttribute(key,attrs[key]);parent.appendChild(n);return n};</script></body></html>
