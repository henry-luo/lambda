<!doctype html><html><head><style>body{margin:0}scene3d{display:block;width:128px;height:128px}</style></head><body><scene3d id="scene" camera="main" ><camera id="main" type="perspective" position="0 0 4" target="0 0 0" fov="90"></camera><mesh id="object" ><geometry id="object-geometry" type="plane" size="2 2 2" ></geometry><material id="object-material" type="basic" color="#ff0000" ></material></mesh></scene3d><script>globalThis.scene=document.getElementById('scene');globalThis.make=(tag,parent,attrs)=>{const n=document.createElement(tag);for(const key in attrs)n.setAttribute(key,attrs[key]);parent.appendChild(n);return n};</script></body></html>
