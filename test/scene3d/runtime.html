<!doctype html>
<html><head><style>body{margin:0}scene3d{display:block;width:160px;height:120px}</style></head>
<body>
<scene3d id="world" camera="main" background="#202936">
  <physics gravity="0 0 0" timestep=".01" state="paused"></physics>
  <camera id="main" type="perspective" position="0 0 4" target="0 0 0" fov="90"></camera>
  <rigid-body id="body" type="dynamic" linear-velocity="1 0 0">
    <collider id="shape" shape="box" size="1 1 1"></collider>
    <mesh><geometry type="box" size="1 1 1"></geometry><material type="basic" color="#ff0000"></material></mesh>
  </rigid-body>
</scene3d>
<script type="module">
import {play, pause, step, seek, reset, snapshot, animation_snapshot, time_scale, capabilities} from '../../lmd/package/scene3d/runtime.ls';
const world=document.getElementById('world');
const operations={play,pause,step,seek,reset,read:snapshot,animation_read:animation_snapshot,time_scale,capabilities};
globalThis.sceneRequest=async (operation,value)=>{
  globalThis.sceneState=null;
  globalThis.sceneState=await (value===undefined?operations[operation](world):operations[operation](world,value));
};
</script>
</body></html>
