<!doctype html>
<html><head><style>body { margin: 0 } scene3d { display: block; width: 160px; height: 120px }</style></head>
<body>
<scene3d id="world" camera="main">
  <physics gravity="0 0 0" timestep=".1" state="paused"></physics>
  <camera id="main" type="perspective" position="0 0 4" target="0 0 0" fov="90"></camera>
  <particle-emitter id="sparks" backend="cpu" shape="point" capacity="16" burst="1"
      rate="0" seed="18446744073709551615" lifetime="2" gravity="0 0 0" velocity="1 0 0" size=".25">
    <geometry type="plane" size="2 2 2"></geometry>
    <material type="basic" color="#ff0000"></material>
  </particle-emitter>
</scene3d>
<script type="module">
import {step, seek, reset, pause, particle_snapshot, particle_events, acknowledge_particle_events, capabilities} from '../../lmd/package/scene3d/runtime.ls';
const world = document.getElementById('world');
const operations = {step, seek, reset, pause, read: particle_snapshot, particle_events, acknowledge_particle_events, capabilities};
globalThis.particleRequest = async (operation, value) => {
  globalThis.particleResult = null;
  globalThis.particleResult = await (value === undefined ? operations[operation](world) : operations[operation](world, value));
};
globalThis.configureParticleRotation = (backend) => {
  const emitter = document.getElementById('sparks');
  emitter.setAttribute('backend', backend);
  emitter.setAttribute('size', '1');
  emitter.setAttribute('velocity', '0 0 0');
  emitter.querySelector('geometry').setAttribute('size', '2 .25 1');
  const curve = document.createElement('particle-rotation-curve');
  curve.setAttribute('times', '0 .1 1');
  curve.setAttribute('values', '0 0 0 0 0 1.5707963267948966 0 0 1.5707963267948966');
  emitter.appendChild(curve);
};
globalThis.configureParticleWorld = (backend) => {
  const emitter = document.getElementById('sparks');
  emitter.setAttribute('backend', backend);
  emitter.setAttribute('space', 'world');
  emitter.setAttribute('position', '-.5 0 0');
  emitter.setAttribute('rotation', '0 0 1.5707963267948966');
  emitter.setAttribute('scale', '2 1 1');
  emitter.setAttribute('gravity', '0 -10 0');
};
globalThis.moveParticleWorld = () => {
  const emitter = document.getElementById('sparks');
  emitter.setAttribute('position', '100 0 0');
  emitter.setAttribute('rotation', '0 0 0');
  emitter.setAttribute('scale', '4 2 1');
  emitter.setAttribute('rate', '10');
};
globalThis.configureParticleSurface = (backend) => {
  const surface = document.createElement('geometry');
  surface.setAttribute('id', 'emission-surface');
  surface.setAttribute('type', 'buffer');
  surface.setAttribute('positions', '-.1 -.1 0 .1 -.1 0 -.1 .1 0 .1 .1 0');
  surface.setAttribute('indices', '0 1 2 2 1 3');
  world.appendChild(surface);
  const emitter = document.getElementById('sparks');
  emitter.setAttribute('backend', backend);
  emitter.setAttribute('shape', 'mesh');
  emitter.setAttribute('surface', 'emission-surface');
  emitter.setAttribute('normal-speed', '1');
  emitter.setAttribute('velocity', '0 0 0');
};
globalThis.moveParticleSurface = () => {
  document.getElementById('emission-surface').setAttribute('positions', '9.9 -.1 0 10.1 -.1 0 9.9 .1 0 10.1 .1 0');
  document.getElementById('sparks').setAttribute('rate', '10');
};
globalThis.configureParticleCollision = () => {
  const emitter = document.getElementById('sparks');
  emitter.setAttribute('position', '0 1 0');
  emitter.setAttribute('velocity', '0 -20 0');
  const floor = document.createElement('rigid-body');
  floor.setAttribute('id', 'particle-floor');
  floor.setAttribute('type', 'fixed');
  floor.setAttribute('position', '0 -.5 0');
  const shape = document.createElement('collider');
  shape.setAttribute('id', 'particle-floor-shape');
  shape.setAttribute('shape', 'box');
  shape.setAttribute('size', '20 1 20');
  floor.appendChild(shape);
  world.appendChild(floor);
  const collision = document.createElement('particle-collision');
  collision.setAttribute('radius', '.05');
  collision.setAttribute('restitution', '1');
  emitter.appendChild(collision);
};
globalThis.readParticleContacts = async () => {
  globalThis.particleContacts = null;
  globalThis.particleContacts = await particle_events(world);
};
globalThis.ackParticleContacts = async () => {
  const packet = globalThis.particleContacts;
  const emitter = packet.emitters[0];
  globalThis.particleContactAck = null;
  globalThis.particleContactAck = await acknowledge_particle_events(world, emitter.id, emitter.through, packet.session, packet.generation);
};
</script>
</body></html>
