<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button,input{position:absolute;top:160px;height:30px;width:80px}</style></head><body><svg id="scene" width="420" height="150"><rect id="keyed" x="10" y="10" width="30" height="30" fill="red"><animate attributeName="x" from="10" to="110" begin="accessKey(a)+0.5s" end="accessKey(z)" dur="2s" fill="freeze"/></rect><rect id="past" x="10" y="60" width="30" height="30" fill="red"><set attributeName="fill" to="blue" begin="indefinite" dur="120s" fill="freeze"/></rect><rect id="future" x="60" y="60" width="30" height="30" fill="red"><set attributeName="fill" to="blue" begin="wallclock(9999-12-31T23:59:59Z)" dur="1s" fill="freeze"/></rect><rect id="expired" x="110" y="60" width="30" height="30" fill="red"><set attributeName="fill" to="blue" begin="wallclock(2000-01-01T00:00:00Z)" dur="1s" fill="freeze"/></rect></svg><input id="focus" style="left:10px"><button id="half" style="left:110px">half</button><button id="one" style="left:210px">one</button><button id="two" style="left:310px">two</button><script>document.getElementById('past').firstElementChild.setAttribute('begin','wallclock('+new Date(Date.now()-60000).toISOString()+')');var scene=document.getElementById('scene');scene.pauseAnimations();scene.setCurrentTime(0);document.getElementById('half').onclick=function(){scene.setCurrentTime(.5);};document.getElementById('one').onclick=function(){scene.setCurrentTime(1);};document.getElementById('two').onclick=function(){scene.setCurrentTime(2);};</script><script>
// equivalent native SMIL clock values and DOM controls provide an independent oracle for unsupported timing syntax.
var wallclockOrigin=Date.now()/1000,accessKeys=[];
document.querySelectorAll('animate,animateTransform,set').forEach(function(animation){
 ['begin','end'].forEach(function(name){var value=animation.getAttribute(name);if(!value)return;
 var tokens=value.split(';').map(function(token){token=token.trim();var clock=/^wallclock\(\s*(.*?)\s*\)$/.exec(token),key=/^accessKey\((.)\)\s*([+-]\s*[0-9.]+s)?$/.exec(token);
 if(clock)return (Date.parse(clock[1])/1000-wallclockOrigin)+'s';
 if(key){accessKeys.push({animation:animation,end:name==='end',key:key[1],offset:key[2]?parseFloat(key[2].replace(/\s/g,'')):0});return 'indefinite';}
 return token;});animation.setAttribute(name,tokens.join(';'));
 });
});
// Chromium defers paused paint after replacing begin values; a round-trip seek samples the resolved zero-time intervals.
requestAnimationFrame(function(){scene.setCurrentTime(1);scene.setCurrentTime(0);});
document.addEventListener('keydown',function(event){if(!event.isTrusted)return;accessKeys.forEach(function(control){if(event.key===control.key){if(control.end)control.animation.endElementAt(control.offset);else control.animation.beginElementAt(control.offset);}});});
</script></body></html>
