<!doctype html><!-- SVG 2 §5.6.5 host clocks; static resource consumers are separate -->
<html><head><style>html,body{margin:0}button{position:absolute;top:140px;width:60px;height:30px}</style></head><body><svg id="scene" width="400" height="130"><rect x="10" y="10" width="50" height="30" fill="red"/><rect id="first" x="100" y="10" width="50" height="30" fill="red"/><rect x="190" y="10" width="50" height="30" fill="red"/><rect id="second" x="280" y="10" width="50" height="30" fill="red"/></svg><svg width="60" height="40" style="position:absolute;left:10px;top:70px"><rect width="50" height="30" fill="blue"/></svg><button id="zero" style="left:10px">0</button><button id="one" style="left:80px">1</button><button id="two" style="left:150px">2</button><button id="rewind" style="left:220px">rewind</button><script>function wire(id,t){document.getElementById(id).onclick=function(){var color="rgb("+(255*(1-t/2))+",0,"+(255*t/2)+")";document.getElementById("first").setAttribute("fill",color);document.getElementById("second").setAttribute("fill",color);};}wire("zero",0);wire("one",1);wire("two",2);wire("rewind",0);</script></body></html>
