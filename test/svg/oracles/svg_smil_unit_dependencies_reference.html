<!doctype html><!-- independent arithmetic oracle; no SMIL evaluation --><html><head><style>html,body{margin:0}button{position:absolute;top:130px;width:65px;height:30px}</style></head><body><svg id="scene" width="300" height="120">
<g font-size="20"><rect x="10" y="10" width="1em" height="20" fill="red"></rect><rect x="170" y="10" width="1em" height="20" fill="red"></rect></g>
<g font-size="20"><path d="M10 60H230" stroke="blue" stroke-width="8" stroke-dasharray="1em 1em"></path></g>
<rect x="10" y="90" width="30" height="20" fill="green"></rect>
</svg><button id="zero" style="left:10px">0</button><button id="one" style="left:90px">1</button><button id="two" style="left:170px">2</button><button id="rewind" style="left:250px">rewind</button>
<script>var scene=document.getElementById("scene");scene.pauseAnimations();scene.setCurrentTime=function(t){var p=Math.min(1,t/2),font=20+20*Math.min(1,Math.max(0,t-.5)),groups=document.querySelectorAll("svg>g");for(var i=0;i<groups.length;i++)groups[i].setAttribute("font-size",font);var rects=groups[0].querySelectorAll("rect");rects[0].setAttribute("width",(1+p)*font);rects[1].setAttribute("width",(1-p)*font+80*p);groups[1].querySelector("path").setAttribute("stroke-dasharray",((1+p)*font)+" "+((1+p)*font));document.querySelector("svg>rect").setAttribute("opacity",1-.5*p);};scene.setCurrentTime(0);function wire(id,t){document.getElementById(id).onclick=function(){scene.setCurrentTime(t);};}wire("zero",0);wire("one",1);wire("two",2);wire("rewind",0);</script></body></html>
