<!doctype html><!-- independent SVG initial values and identity-matrix interpolation --><html><head><style>html,body{margin:0}button{position:absolute;top:150px;width:60px;height:30px}</style></head><body><svg id="scene" width="300" height="140"><defs><rect id="shape" width="30" height="20" fill="red"/><linearGradient id="paint" gradientUnits="userSpaceOnUse" x1="10" x2="110"><stop stop-color="red"></stop><stop offset="1" stop-color="blue"/></linearGradient><filter id="matrix" filterUnits="userSpaceOnUse" x="180" y="10" width="40" height="20" color-interpolation-filters="sRGB"><feColorMatrix></feColorMatrix></filter></defs><use id="instance" x="10" y="10"></use><rect x="10" y="60" width="100" height="20" fill="url(#paint)"/><rect x="180" y="10" width="40" height="20" fill="red" filter="url(#matrix)"/></svg><button id="zero" style="left:10px">0</button><button id="one" style="left:90px">1</button><button id="two" style="left:170px">2</button><button id="rewind" style="left:250px">rewind</button><script>var scene=document.getElementById("scene");scene.pauseAnimations();scene.setCurrentTime=function(t){document.getElementById("instance").setAttribute("href",t>=1?"#shape":"");document.querySelector("stop").setAttribute("offset",t/2);var p=t/2;document.querySelector("feColorMatrix").setAttribute("values",(1-p)+" 0 "+p+" 0 0 0 1 0 0 0 "+p+" 0 "+(1-p)+" 0 0 0 0 0 1 0");};scene.setCurrentTime(0);function wire(id,t){document.getElementById(id).onclick=function(){scene.setCurrentTime(t);};}wire("zero",0);wire("one",1);wire("two",2);wire("rewind",0);</script></body></html>
