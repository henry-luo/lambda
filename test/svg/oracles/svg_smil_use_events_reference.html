<!doctype html><html><head><style>html,body{margin:0}svg{position:absolute;left:0;top:0}button{position:absolute;top:260px;left:10px;width:100px;height:30px}</style></head><body><svg id="scene" width="420" height="240"><defs><g id="prototype"><rect id="leaf" x="10" y="10" width="60" height="50" fill="red"><set attributeName="fill" to="blue" begin="click" dur="1s" fill="freeze"/></rect><rect x="10" y="90" width="60" height="50" fill="red"><set attributeName="fill" to="lime" begin="leaf.click" dur="1s" fill="freeze"/></rect><rect x="10" y="150" width="60" height="40" fill="red"><set attributeName="fill" to="blue" begin="accessKey(k)" dur="1s" fill="freeze"/></rect></g></defs></svg><button id="replace">replace</button><script>var scene=document.getElementById('scene');scene.pauseAnimations();scene.setCurrentTime(0);scene.addEventListener('click',function(e){scene.setAttribute('data-target',e.target.id);});document.getElementById('replace').onclick=function(){var a=document.getElementById('a'),c=a.cloneNode(true);a.remove();c.setAttribute('id','c');scene.appendChild(c);};</script><script>
// direct DOM instances use native SMIL to implement SVG 2's implicit-target and ID-broadcast timing independently of use shadow trees.
var template=document.getElementById('prototype'),lastQualified=null,lastKeys={};
function instance(id,x){var group=template.cloneNode(true);group.id=id;group.setAttribute('transform','translate('+x+',0)');
 var leaf=group.querySelector('#leaf');leaf.removeAttribute('id');group.querySelectorAll('set').forEach(function(animation){var key=/^accessKey\((.)\)$/.exec(animation.getAttribute('begin'));if(key){animation.setAttribute('data-key',key[1]);animation.setAttribute('begin','indefinite');}if(animation.getAttribute('begin')==='leaf.click'){animation.setAttribute('begin','indefinite');animation.setAttribute('data-qualified','');}});
 group.addEventListener('click',function(event){scene.setAttribute('data-target',group.id);if(event.target===leaf){lastQualified=scene.getCurrentTime();scene.querySelectorAll('[data-qualified]').forEach(function(animation){animation.beginElement();});}});
 scene.appendChild(group);if(lastQualified!==null)group.querySelectorAll('[data-qualified]').forEach(function(animation){animation.beginElementAt(lastQualified-scene.getCurrentTime());});group.querySelectorAll('[data-key]').forEach(function(animation){var key=animation.getAttribute('data-key');if(lastKeys[key]!==undefined)animation.beginElementAt(lastKeys[key]-scene.getCurrentTime());});return group;}
scene.addEventListener('click',function(event){var node=event.target;while(node&&node.parentNode!==scene)node=node.parentNode;if(node&&node!==scene)scene.setAttribute('data-target',node.id);});
instance('a',0);instance('b',200);document.getElementById('replace').onclick=function(){var old=document.getElementById('a')||document.getElementById('c'),id=old.id==='a'?'c':'d';old.remove();instance(id,0);};
document.addEventListener('keydown',function(event){if(!event.isTrusted)return;lastKeys[event.key]=scene.getCurrentTime();scene.querySelectorAll('[data-key]').forEach(function(animation){if(animation.getAttribute('data-key')===event.key)animation.beginElement();});});
</script></body></html>
