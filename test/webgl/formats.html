<!doctype html><html><body><canvas id="canvas" width="8" height="8"></canvas><span id="result" data-result="pending"></span><script>
const result=document.getElementById('result'),gl=document.getElementById('canvas').getContext('webgl2');
let checks=0;
function check(value,message){if(!value)throw new Error(message);checks++;}
function texture(format,width=8,height=8){const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
 gl.texStorage2D(gl.TEXTURE_2D,1,format,width,height);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);return texture;}
try {
 check(gl.getExtension('EXT_color_buffer_float')!==null,'float renderability extension');
 check(gl.getExtension('OES_texture_float_linear')!==null,'float filtering extension');
 const framebuffer=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,framebuffer);
 const color=texture(gl.RGBA16F);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,color,0);
 check(gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE,'half-float target complete');
 gl.clearColor(.25,.5,.75,1);gl.clear(gl.COLOR_BUFFER_BIT);
 const floats=new Float32Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.FLOAT,floats);
 check(floats.every((value,i)=>Math.abs(value-[.25,.5,.75,1][i])<.002),'half-float render/read behavior');
 const depth=texture(gl.DEPTH_COMPONENT32F);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,depth,0);
 check(gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE,'depth texture complete');
 gl.clearDepth(.375);gl.clear(gl.DEPTH_BUFFER_BIT);
 const program=gl.createProgram();
 for(const [type,source] of [[gl.VERTEX_SHADER,'#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0,1);}'],
  [gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;uniform sampler2D image;out vec4 color;void main(){color=vec4(vec3(texture(image,vec2(.5)).r),1);}']]) {
  const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);
  check(gl.getShaderParameter(shader,gl.COMPILE_STATUS),gl.getShaderInfoLog(shader));gl.attachShader(program,shader);gl.deleteShader(shader);
 }
 gl.linkProgram(program);check(gl.getProgramParameter(program,gl.LINK_STATUS),gl.getProgramInfoLog(program));gl.useProgram(program);
 const vao=gl.createVertexArray();gl.bindVertexArray(vao);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const position=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,8,8);gl.bindTexture(gl.TEXTURE_2D,depth);gl.drawArrays(gl.TRIANGLES,0,3);
 const pixel=new Uint8Array(4);gl.readPixels(4,4,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
 check(Math.abs(pixel[0]-96)<=1,'depth texture samples cleared depth');
 const linear=texture(gl.RGBA32F,2,1);
 gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,2,1,gl.RGBA,gl.FLOAT,new Float32Array([0,0,0,1,1,1,1,1]));
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.drawArrays(gl.TRIANGLES,0,3);gl.readPixels(4,4,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
 check(Math.abs(pixel[0]-128)<=1,'32-bit float linear interpolation');
 check(gl.getError()===gl.NO_ERROR,'formats leave no GL error');
 for(const texture of [color,depth,linear])gl.deleteTexture(texture);
 gl.deleteFramebuffer(framebuffer);gl.deleteBuffer(buffer);gl.deleteVertexArray(vao);gl.deleteProgram(program);
 result.setAttribute('data-checks',checks);result.setAttribute('data-result','passed');
}catch(error){result.setAttribute('data-result',String(error));throw error;}
</script></body></html>
