<!doctype html><html><head><style>
* { box-sizing: border-box; }
body { margin: 0; font: 13px Helvetica, sans-serif; }
button { cursor: pointer; border: 0; background: transparent; }
button, input, select { font: inherit; color: inherit; }
#result { display: flex; width: 100%; height: 400px; user-select: none; }
.workspace, .browser { display: flex; flex: 1; min-width: 0; min-height: 0; flex-direction: column; }
#viewport { flex: 1; min-height: 0; overflow: auto; contain: size layout; }
#grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); gap: 22px 10px; align-content: start; padding: 30px 22px; }
.tile { display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 12px 5px 10px; gap: 8px; font-size: 12px; }
.tile:hover { background: #f4f7fa; }
.graphic { width: 76px; height: 68px; flex-shrink: 0; background: lightblue; }
.label { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; line-height: 1.5; max-width: 120px; }
.size { font-size: 10px; }
</style></head><body><div id="result"><div class="workspace"><div class="browser"><div id="viewport"><div id="grid">
<button class="tile"><span class="graphic"></span><span id="label" class="label">verify-wasm-setup.sh</span><span class="size">3.2 KB</span></button>
<button class="tile"><span class="graphic"></span><span class="label">verify-windows-exe.sh</span><span class="size">6.9 KB</span></button>
<button class="tile"><span class="graphic"></span><span class="label">visual_diff.sh</span><span class="size">5.8 KB</span></button>
<button class="tile"><span class="graphic"></span><span class="label">short.txt</span><span class="size">10 bytes</span></button>
<button class="tile"><span class="graphic"></span><span class="label">a-very-long-filename-with-multiple-lines.txt</span><span class="size">11 bytes</span></button>
<button class="tile"><span class="graphic"></span><span class="label">another.txt</span><span class="size">12 bytes</span></button>
<button class="tile"><span class="graphic"></span><span class="label">last.txt</span><span class="size">13 bytes</span></button>
</div></div></div></div></div><p id="ordinary">Ordinary selectable text</p><p style="cursor:crosshair"><span id="crosshair">Crosshair cursor text</span></p><p style="cursor:text"><span id="explicit">Explicit text cursor</span></p>
<div id="gap-one" style="gap:8px"></div><div id="gap-axis" style="gap:3px 9px;row-gap:4px"></div><div id="gap-later" style="row-gap:2px;gap:6px 7px"></div>
</body></html>
