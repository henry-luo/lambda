<!doctype html>
<html><head><style>
html, body { margin: 0; background: white; }
#color { position: absolute; left: 20px; top: 20px; width: 50px; height: 50px;
         animation-name: color; animation-duration: 2s;
         animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes color { from { background-color: #ff0000; }
                   to { background-color: #0000ff; } }
</style></head><body><div id="color"></div></body></html>
