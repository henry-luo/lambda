<!doctype html>
<style>
@font-face { font-family: BoxRoleMetrics; src: url("../layout/data/support/fonts/Ahem.ttf"); }
body { margin: 0; font: 20px/1 BoxRoleMetrics; }
.sized { width: 100px; height: 70px; text-indent: 30px; text-align: right; }
.percentage { display: inline-block; width: 100%; height: 100%; padding: 8px; box-sizing: border-box; }
</style>
<div id="result">
  <div><span id="inline" class="sized">XX</span></div>
  <div id="atomic" class="sized" style="display: inline-block">XX</div>
  <div style="display: flex; width: 200px"><div id="item" style="width: 50px">XX</div></div>
  <div style="display: flex; min-height: 600px">
    <ul style="display: flex; flex-direction: column; width: 200px; margin: 0; padding: 0">
      <li><a id="cyclic" class="percentage">XX</a></li>
      <li><a id="cyclic-math" class="percentage" style="height: calc(50% + 10px)">XX</a></li>
    </ul>
  </div>
  <div style="height: 80px"><a id="definite" class="percentage" style="height: calc(50% + 10px)">XX</a></div>
  <div id="ratio-intrinsic" style="width: min-content; height: 25px">
    <div style="height: 40px; aspect-ratio: auto 4/1; box-sizing: border-box; padding-top: 15px"></div>
  </div>
  <div id="cyclic-width" style="width: fit-content; min-width: 100px; height: 100px">
    <div style="width: fit-content; min-width: 100%; height: 100px"></div>
  </div>
  <div id="ratio-percentage" style="width: 100px; aspect-ratio: 1/1">
    <div style="height: 100%"></div>
  </div>
  <div id="intrinsic-fit-limit" style="width: min-content; height: 50px">
    <div style="width: 200px; max-width: fit-content(100px)">
      <div style="display: inline-block; width: 60px"></div>
      <div style="display: inline-block; width: 60px"></div>
    </div>
  </div>
</div>
