<!doctype html><style>body{margin:0}.case{width:200px;column-count:1;margin-bottom:10px;background:#ddd}.wrapper{height:50px}.tall{height:100px;width:100px;background:green}</style><section id="result">
<div class="case" id="balanced"><div class="wrapper"><div class="tall"></div></div></div>
<div class="case" id="sequential" style="column-fill:auto"><div class="wrapper"><div class="tall"></div></div></div>
<div class="case" id="fixed" style="height:50px"><div class="wrapper"><div class="tall"></div></div></div>
<div class="case" id="clipped"><div class="wrapper" style="overflow:hidden"><div class="tall"></div></div></div>
<div class="case" id="positioned"><div class="wrapper"><div class="tall" style="position:absolute"></div></div></div>
<div class="case" id="following"><div class="wrapper"><div class="tall"></div></div><div style="height:20px;background:blue"></div></div>
<div class="case" id="collapsed"><div><h3 style="margin:10px 0;height:20px;font-size:16px"></h3></div></div>
<div class="case" id="nested"><div class="wrapper"><div style="padding-top:10px"><div style="padding-top:20px"><div class="tall"></div></div></div></div></div>
<div class="case" id="nested-clipped"><div class="wrapper"><div style="height:30px;overflow:hidden"><div class="tall"></div></div></div></div>
</section>
