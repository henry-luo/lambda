<!doctype html>
<meta charset="utf-8">
<style>
@font-face { font-family: Ahem; src: url('../layout/data/support/fonts/Ahem.ttf'); }
body { margin: 0; font: 20px/1 Ahem; }
.parent { letter-spacing: 10px; word-spacing: 10px; }
.zero { letter-spacing: 0; word-spacing: 0; }
.normal { letter-spacing: normal; word-spacing: normal; }
.intrinsic { display: inline-block; }
</style>
<div id="result" class="parent">
  <div id="zero" class="zero">A A</div>
  <div id="normal" class="normal">A A</div>
  <div class="zero"><span id="inherited">A A</span></div>
  <span id="intrinsic" class="zero intrinsic">A A</span>
</div>
