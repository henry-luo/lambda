<!doctype html><meta charset="utf-8"><style>
body{margin:0;font:20px/20px sans-serif}.outer{columns:2;column-height:60px;column-wrap:wrap;gap:10px 0;width:100px;height:100px;margin-bottom:20px;background:#fbb}.inner{column-count:2;gap:0;background:#bfb}.leaf{background:#08c}
</style><div id="result">
<div id="balanced" class="outer" style="column-fill:balance"><div id="balanced-inner" class="inner" style="column-count:2"><div id="balanced-leaf" class="leaf" style="height:360px"></div></div></div>
<div id="short" class="outer" style="column-fill:balance"><div id="short-inner" class="inner" style="column-count:2"><div id="short-leaf" class="leaf" style="height:280px"></div></div></div>
<div id="three" class="outer" style="column-fill:balance"><div id="three-inner" class="inner" style="column-count:3"><div id="three-leaf" class="leaf" style="height:480px"></div></div></div>
<div id="automatic" class="outer" style="column-fill:auto"><div id="automatic-inner" class="inner" style="column-count:2"><div id="automatic-leaf" class="leaf" style="height:360px"></div></div></div>
<div id="ordinary" class="outer" style="column-fill:balance"><div id="ordinary-leaf" class="leaf" style="height:180px"></div></div>
<div id="spanners" class="outer" style="column-height:20px;height:auto"><div style="background:green"><div style="height:10px"></div><div style="column-span:all;height:5px"></div><div style="height:30px"></div><div style="column-span:all;height:15px"></div><div style="column-span:all;height:15px"></div><div style="height:30px"></div></div></div>
</div>
