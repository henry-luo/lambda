<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JS MIR cache fresh realm verification</title>
</head>
<body>
  <div id="result">pending</div>
  <script src="./js_cache_external_classic.js"></script>
  <script>
    const isolated = typeof window.__lambdaCacheRealmLeak === "undefined" &&
      typeof Array.prototype.__lambdaCacheRealmLeak === "undefined" &&
      window.__lambdaExternalCacheRuns === 1 &&
      lambdaExternalCacheDeclaration === "external-ready";
    document.getElementById("result").textContent = isolated
      ? "js-cache-realm-isolated"
      : "js-cache-realm-leaked";
    const tune4LifecycleUserNames = { tune4OnlyInConsumerTable: true };
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("result").textContent += tune4LifecycleUserNames.tune4OnlyInConsumerTable
        ? "|dom"
        : "|bad-dom";
    });
    window.addEventListener("load", function () {
      document.getElementById("result").textContent += "|load";
    });
  </script>
</body>
</html>
