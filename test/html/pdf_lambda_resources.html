<html><head><meta charset="utf-8"><style>
html, body { margin: 0; padding: 0; background: white; font: 18px Arial; }

img { width: 80px; height: 40px; object-fit: cover; }

</style></head><body>
<div class="clip"><div class="ink">Alpha and clip</div></div>
