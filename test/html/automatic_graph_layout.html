<!doctype html>
<html><head><meta charset="utf-8"><title>Automatic graph layout</title>
<style>
body { margin: 0; }
.node { display: block; width: 80px; height: 20px; }
</style></head><body id="result">
<graph id="graph" data-radiant-layout="lambda-graph" data-direction="LR"
    style="display:block;position:relative">
  <div id="a" class="node" data-graph-role="node" data-node-id="a">Alpha</div>
  <div id="b" class="node" data-graph-role="node" data-node-id="b">Beta</div>
  <span data-graph-role="edge" data-edge-id="ab" data-from="a" data-to="b"
      style="display:block;width:0;height:0"></span>
</graph>
</body></html>
