<!doctype html><html><head><meta charset="utf-8"><style>
body { margin:0; font:0px/0 sans-serif }
.case { margin-bottom:20px }
table { width:40px; border-collapse:separate; border-spacing:0 }
td { padding:0; background:lime }
</style></head><body><div id="result">
<div class="case"><table id="direct"><tr><td><img id="direct-image" src="layout_intrinsic_image.svg" width="64" style="max-width:100%"></td></tr></table></div>
<div class="case"><table id="anchor"><tr><td><a><img id="anchor-image" src="layout_intrinsic_image.svg" width="64" style="max-width:100%"></a></td></tr></table></div>
<div class="case"><table id="span"><tr><td><span><img id="span-image" src="layout_intrinsic_image.svg" width="64" style="max-width:100%"></span></td></tr></table></div>
<div class="case"><table id="unconstrained"><tr><td><a><img id="unconstrained-image" src="layout_intrinsic_image.svg" width="64"></a></td></tr></table></div>
<div class="case"><table id="half"><tr><td><a><img id="half-image" src="layout_intrinsic_image.svg" width="64" style="max-width:50%"></a></td></tr></table></div>
<div class="case"><table id="math"><tr><td><a><img id="math-image" src="layout_intrinsic_image.svg" width="64" style="max-width:calc(100%)"></a></td></tr></table></div>
<div class="case"><table id="minimum"><tr><td><a><img id="minimum-image" src="layout_intrinsic_image.svg" width="64" style="max-width:100%;min-width:64px"></a></td></tr></table></div>
<div class="case"><table id="decorated"><tr><td><img id="decorated-image" src="layout_intrinsic_image.svg" width="64" style="max-width:100%;padding:4px;border:2px solid black"></td></tr></table></div>
<div class="case"><table id="css-width"><tr><td><img id="css-width-image" src="layout_intrinsic_image.svg" style="width:64px;max-width:100%"></td></tr></table></div>
</div></body></html>
