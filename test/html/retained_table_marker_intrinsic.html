<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Retained table marker intrinsic sizing</title>
<style>
  table { border-collapse: collapse; }
  td { border: 1px solid #333; padding: 4px; }
  ul { margin: 0; }
</style>
</head>
<body>
<table>
  <tr>
    <td id="items">
      <ul>
        <li>first retained list item</li>
        <li>second retained list item</li>
      </ul>
    </td>
    <td>table intrinsic sizing peer</td>
  </tr>
</table>
<script>
  setTimeout(function () {
    const item = document.createElement("span");
    item.textContent = " after the retained reflow";
    document.getElementById("items").appendChild(item);
  }, 0);
</script>
</body>
</html>
