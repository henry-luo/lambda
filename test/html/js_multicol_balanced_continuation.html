<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    #columns { width: 720px; column-count: 2; column-gap: 32px; }
    #columns p { margin: 0 16px 16px; font: 16px/20px monospace; }
  </style>
</head>
<body>
  <div id="columns">
    <p>first<br>first<br>first<br>first<br>first<br>first<br>first<br>first<br>first<br>first<br>first<br>first</p>
    <p id="continued">second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second<br>second</p>
  </div>
  <div id="geometry-state"></div>
  <script>
    window.addEventListener('load', function() {
      var rect = document.getElementById('continued').getBoundingClientRect();
      document.getElementById('geometry-state').setAttribute(
          'data-continued-width', String(Math.round(rect.width)));
    });
  </script>
</body>
</html>
