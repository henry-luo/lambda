<!doctype html>
<style>
@font-face { font-family:Ahem; src:url('../layout/data/font/Ahem.ttf'); }
body { margin:0; font:20px/60px Ahem; }
.row { width:40px; word-break:break-all; }
.wide { width:80px; }
.compact { line-height:20px; }
.reading { font-size:50%; white-space:nowrap; }
.tall .reading-b { font-size:30px; }
.under ruby { ruby-position:under; }
.base-level { display:ruby-base-container; }
.text-level { display:ruby-text-container; }
.level-base { display:ruby-base; white-space:nowrap; }
.bound, .emergency { word-break:normal; }
.emergency { overflow-wrap:break-word; }
.center { text-align:center; }
</style>
