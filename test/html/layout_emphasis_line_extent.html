<!doctype html>
<style>
@font-face { font-family: Ahem; src: url('../layout/data/support/fonts/Ahem.ttf'); }
body { margin: 0; }
div { font: 20px/1 Ahem; }
.mark { text-emphasis: dot; }
#under { text-emphasis-position: under; }
#clipped { overflow: hidden; }
#spaces { white-space: pre; }
</style>
<div id="result">
<div id="plain">ABC</div>
<div class="mark" id="over">ABC</div>
<div class="mark" id="under">ABC</div>
<div class="mark" id="clipped">ABC</div>
<div class="mark" id="spaces">   </div>
<div class="mark" id="punctuation">...</div>
</div>
