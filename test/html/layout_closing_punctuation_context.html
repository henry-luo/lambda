<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family:Ahem; src:url("../layout/data/font/Ahem.ttf") }
body { margin:0; font:10px/20px Ahem }
.case { width:70px; margin-bottom:20px; background:#eee }
code, span, b { font:inherit }
code, span.target { background:lime }
b { font-weight:normal }
.decorated { width:74px }
.decorated code { padding:0 2px }
i { display:inline-block; width:10px; height:10px; background:red }
</style></head><body id="result">
<div class="case" id="split">[<code id="split-code">aa bb)</code>]</div>
<div class="case" id="nested">[<span class="target" id="nested-span"><b>aa bb)</b></span>]</div>
<div class="case decorated" id="decorated">[<code id="decorated-code">aa bb)</code>]</div>
<div class="case" id="same-node">[<code id="same-code">aa bb)]</code></div>
<div class="case" id="atomic">[<code id="atomic-code">aa bb)</code><i></i></div>
<div class="case" id="ex">[<code id="ex-code">aa bb)</code>!</div>
<div class="case" id="is">[<code id="is-code">aa bb)</code>.</div>
<div class="case" id="sy">[<code id="sy-code">aa bb)</code>/</div>
<div class="case" id="same-ex">[<code id="same-ex-code">aa bb)!</code></div>
<div class="case" id="nowrap" style="white-space:nowrap">[<code id="nowrap-code">aa bb)</code>]</div>
<div class="case" id="preserved">[<code id="preserved-code" style="white-space:break-spaces">aa bb)</code>]</div>
<div class="case" id="anywhere" style="line-break:anywhere">[<code id="anywhere-code">aa bb)]</code></div>
</body></html>
