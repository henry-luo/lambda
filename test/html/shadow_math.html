<!doctype html>
<style>
body{--unit:10px}
#result{box-shadow:var(--unit) calc(0px - var(--unit) / 2) calc(var(--unit) * 2) 2px rgba(20,40,60,0.5),inset calc(1px + 1px) 3px min(4px,8px) max(0px,1px) #abcdef}
#text{text-shadow:clamp(1px,2px,3px) calc(6px / 2) max(4px,2px) rgb(70,80,90)}
</style>
<div id="result">Shadow lengths</div><span id="text">Text shadow lengths</span>
