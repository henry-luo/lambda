<!DOCTYPE html>
<html>
<head>
    <title>DOM Style Test</title>
    <style>
        #styled { color: red; font-size: 16px; }
        .box { display: block; margin: 10px; }
        .percent-font { font-size: 100%; }
        .font-parent { font-size: .875em; }
        .relative-font { font-size: 2.857em; }
    </style>
</head>
<body>
    <div id="styled" class="box" style="background-color: blue; padding: 5px;">
        Styled element
    </div>
    <div id="plain">Plain element</div>
    <div id="percent-font" class="percent-font">Percent font</div>
    <div class="font-parent"><div id="relative-font" class="relative-font">Relative font</div></div>
    <div id="multi" style="width: 100px; height: 50px; border: 1px solid black;">
        Multi-style
    </div>
</body>
</html>
