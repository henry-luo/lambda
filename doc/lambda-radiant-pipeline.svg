      <rect x="1260" y="585" width="200" height="30" rx="15"/>
      <rect x="1260" y="618" width="200" height="30" rx="15"/>
      <rect x="1260" y="651" width="200" height="30" rx="15"/>
      <rect x="1260" y="684" width="200" height="30" rx="15"/>
      <rect x="1260" y="717" width="200" height="30" rx="15"/>
      <rect x="1260" y="750" width="200" height="30" rx="15"/>
    </g>
    <g fill="#31466f" class="node">
      <text x="1280" y="539">Markdown</text>
      <text x="1280" y="572">RST</text>
      <text x="1280" y="605">Org mode</text>
