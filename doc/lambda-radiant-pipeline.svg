  <!-- small legend -->
  <g class="sans" transform="translate(50 952)">
    <circle cx="6" cy="-4" r="5" fill="#3b9b9b"/>
    <text x="18" y="0" fill="#718698" font-size="12">many sources</text>
    <path d="M115 -4 H151" stroke="#96a9bb" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
    <text x="163" y="0" fill="#718698" font-size="12">shared model</text>
    <path d="M270 -4 H306" stroke="#96a9bb" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
