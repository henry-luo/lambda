name: Lambda Fuzz Soak

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Campaign duration in seconds'
        required: false
        default: '3600'
  schedule:
    - cron: '0 7 * * 0'

env:
  DOCKER_IMAGE: lambda-linux-ci

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Linux test image
        run: docker build -t "$DOCKER_IMAGE" -f .github/workflows/Dockerfile.linux .

      - name: Run one-hour fuzz soak
        env:
          FUZZ_DURATION: ${{ inputs.duration || '3600' }}
        run: |
          docker run --rm \
            -e FUZZ_DURATION \
            -v "${{ github.workspace }}:/lambda" \
            -w /lambda \
            "$DOCKER_IMAGE" \
            bash -lc 'bash setup-linux-deps.sh && make fuzz-lambda-extended duration="$FUZZ_DURATION" timeout=10'

      - name: Upload fuzz findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-fuzz-soak-artifacts
          path: temp/lambda-fuzz/
          retention-days: 30
          if-no-files-found: ignore
