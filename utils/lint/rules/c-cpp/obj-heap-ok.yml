id: obj-heap-ok
language: cpp
severity: error
message: >-
  Typed struct heap allocation in Radiant should be reviewed as a long-lived
  heap root. Add "// OBJ_HEAP_OK: <reason>" when it has no natural pool/scratch
  owner; otherwise move it to the correct lifetime owner.
metadata:
  suppress: OBJ_HEAP_OK
rule:
  pattern:
    context: "void f() { $T* $V = ($T*)mem_calloc($$$A); }"
    selector: declaration
files:
  - "radiant/**/*.{c,cpp,h,hpp,mm}"
ignores:
  # the Core Graphics backend is not built (exclude_source_files); its libc
  # calloc/free pairs are reviewed when it is brought back
  - "radiant/rdt_vector_cg.mm"
  - "radiant/*event*"
  - "radiant/*edit*"
  - "radiant/*script*"
  - "radiant/state_store*"
  - "radiant/browsing*"
  - "radiant/clipboard*"
  - "radiant/text_control*"
  - "radiant/ime_*"
  - "radiant/webview*"
  - "radiant/window*"
  - "radiant/cmd_*"
  - "radiant/network*"
  - "radiant/source_pos*"
  - "radiant/dom_range*"
  - "radiant/*selection*"
  - "radiant/devtool*"
  - "radiant/*automation*"
  - "radiant/ui_*"
  - "radiant/*menu*"
  - "radiant/focus*"
  - "radiant/keyboard*"
  - "radiant/undo*"
  - "radiant/caret*"
  - "radiant/drag*"
